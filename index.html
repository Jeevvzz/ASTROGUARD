<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroGuard - Space Weather Console</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family: "Segoe UI", Roboto, sans-serif;
    background:#02050a;
    color:#e5e7eb;
}

/* 🌍 AURORA BACKGROUND (FIXED) */
body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:
    linear-gradient(to bottom, rgba(0,0,0,0.75), #02050a),
    url("https://services.swpc.noaa.gov/images/ovation/north/latest.jpg") center/cover no-repeat;
    z-index:-1;
}

/* CONTAINER */
.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
    background:rgba(10,15,30,0.9);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:10px;
}

.logo{
    font-weight:700;
    font-size:18px;
}

.sub{
    font-size:11px;
    opacity:.6;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:12px;
    margin-top:15px;
}

/* CARD */
.card{
    background:rgba(10,15,30,0.9);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:10px;
    padding:14px;
}

/* INDICATOR */
.indicator{text-align:center}
.indicator h2{font-size:26px}
.indicator p{font-size:11px;opacity:.6}

/* SCORE */
.score{text-align:center;margin-top:15px}

.circle{
    width:150px;height:150px;
    border-radius:50%;
    border:2px solid #10b981;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    margin:auto;
}

.circle.mid{border-color:#f59e0b}
.circle.bad{border-color:#ef4444}

.circle h1{font-size:40px}

/* ALERT */
.alert{
    margin-top:15px;
    padding:10px;
    border-radius:6px;
    font-size:13px;
}
.red{background:rgba(239,68,68,0.2)}
.green{background:rgba(16,185,129,0.2)}
.yellow{background:rgba(245,158,11,0.2)}

/* CHART */
.chart-box{
    margin-top:15px;
    height:220px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
    <div>
        <div class="logo">🛰 AstroGuard</div>
        <div class="sub">DATA: NOAA SWPC + NASA DONKI</div>
    </div>
    <div id="time"></div>
</div>

<div id="alert"></div>

<div class="grid" id="indicators"></div>

<div class="card score" id="scoreBox"></div>

<div class="card chart-box">
    <canvas id="chart"></canvas>
</div>

</div>

<script>
let chart=null;

/* SAFE FETCH */
async function safeFetch(url){
    try{
        const res = await fetch(url);
        return await res.json();
    }catch{
        return null;
    }
}

/* SCORE CALC */
function calcScore(kp,wind,flares){
    let score=100;

    if(kp>=7) score-=30;
    else if(kp>=5) score-=20;

    if(wind>700) score-=20;
    else if(wind>500) score-=10;

    score -= flares.length*5;

    return Math.max(0,score);
}

/* MAIN LOAD */
async function load(){

    document.getElementById("time").innerText =
        new Date().toLocaleTimeString();

    const [kpData,windData,flareData] = await Promise.all([
        safeFetch("https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"),
        safeFetch("https://services.swpc.noaa.gov/products/solar-wind/plasma-7-day.json"),
        safeFetch("https://api.nasa.gov/DONKI/FLR?api_key=DEMO_KEY")
    ]);

    let kp=3, wind=400, flares=[];

    /* FIXED KP BUG */
    if(Array.isArray(kpData) && kpData.length>1){
        const last = kpData[kpData.length-1];
        kp = parseFloat(last[1]);
        if(isNaN(kp)) kp=3;
    }

    if(Array.isArray(windData) && windData.length>1){
        const last = windData[windData.length-1];
        wind = parseFloat(last[2]) || 400;
    }

    if(Array.isArray(flareData)){
        flares = flareData.slice(-5);
    }

    const score = calcScore(kp,wind,flares);

    /* ALERT */
    let alertHTML="";
    if(kp>=7) alertHTML='<div class="alert red">⚠ Geomagnetic Storm Active</div>';
    else if(score>80) alertHTML='<div class="alert green">✅ Excellent Conditions</div>';
    else if(score<40) alertHTML='<div class="alert yellow">⚡ High Interference</div>';

    document.getElementById("alert").innerHTML=alertHTML;

    /* INDICATORS */
    document.getElementById("indicators").innerHTML=`
    <div class="card indicator"><p>Kp Index</p><h2>${kp.toFixed(1)}</h2></div>
    <div class="card indicator"><p>Solar Wind</p><h2>${wind}</h2></div>
    <div class="card indicator"><p>Flares</p><h2>${flares.length}</h2></div>
    <div class="card indicator"><p>Aurora</p><h2>${kp>=7?"High":kp>=5?"Medium":"Low"}</h2></div>
    `;

    /* SCORE */
    document.getElementById("scoreBox").innerHTML=`
    <div class="circle ${score<40?"bad":score<70?"mid":""}">
        <h1>${score}</h1>
        <small>/100</small>
    </div>
    <p style="margin-top:8px">${score>70?"Excellent":"Unstable"}</p>
    `;

    /* GRAPH */
    const labels=[], data=[];
    for(let i=6;i>=0;i--){
        labels.push(`D${7-i}`);
        data.push(Math.max(30,score + (Math.random()*20-10)));
    }

    if(chart) chart.destroy();

    chart=new Chart(document.getElementById("chart"),{
        type:"line",
        data:{
            labels,
            datasets:[{
                data,
                borderColor:"#10b981",
                backgroundColor:"rgba(16,185,129,0.1)",
                fill:true,
                tension:.4
            }]
        },
        options:{
            plugins:{legend:{display:false}},
            scales:{x:{display:false},y:{display:false}}
        }
    });
}

/* RUN */
load();
setInterval(load,60000);

</script>

</body>
</html>
