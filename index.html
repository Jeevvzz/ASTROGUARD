<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroGuard - Advanced Space Weather Analytics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }
        
        /* Real Space Background */
        #space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.9) 100%), 
                        url('https://apod.nasa.gov/apod/image/2304/NGC1499_RGBwUnoband_2000.jpg') center/cover;
            z-index: 0;
            filter: brightness(0.6);
        }
        
        .stars-overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(2px 2px at 60% 70%, white, transparent),
                radial-gradient(1px 1px at 50% 50%, white, transparent),
                radial-gradient(1px 1px at 80% 10%, white, transparent),
                radial-gradient(2px 2px at 90% 60%, white, transparent);
            background-size: 200% 200%;
            animation: sparkle 100s linear infinite;
            opacity: 0.5;
            z-index: 1;
        }
        
        @keyframes sparkle {
            0%, 100% { background-position: 0% 0%, 40% 40%, 80% 80%, 20% 60%, 90% 10%; }
            25% { background-position: 100% 100%, 60% 20%, 30% 70%, 90% 40%, 10% 90%; }
            50% { background-position: 50% 50%, 80% 80%, 10% 10%, 70% 30%, 40% 60%; }
            75% { background-position: 20% 80%, 30% 30%, 60% 40%, 10% 80%, 80% 20%; }
        }
        
        /* Container */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px 30px;
        }
        
        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo-icon {
            font-size: 40px;
        }
        
        .logo-text h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }
        
        .logo-text p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
        }
        
        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            color: #10b981;
            font-weight: 600;
        }
        
        .live-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px #10b981; }
            50% { opacity: 0.3; box-shadow: 0 0 0px #10b981; }
        }
        
        .settings-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
        }
        
        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(90deg);
        }
        
        /* Instrument Selector */
        .instrument-selector {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 30px;
        }
        
        .selector-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .instruments {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .instrument-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .instrument-chip:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .instrument-chip.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: white;
            font-weight: 600;
        }
        
        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .glass-card {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            transition: all 0.3s ease;
        }
        
        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
        }
        
        /* Score Card */
        .score-section {
            text-align: center;
        }
        
        .score-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        
        .score-display {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 25px;
        }
        
        .score-circle-bg {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0%, transparent var(--progress), rgba(255,255,255,0.05) var(--progress));
        }
        
        .score-circle {
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border: 3px solid;
        }
        
        .score-circle.good { border-color: #10b981; box-shadow: 0 0 30px rgba(16, 185, 129, 0.4); }
        .score-circle.moderate { border-color: #f59e0b; box-shadow: 0 0 30px rgba(245, 158, 11, 0.4); }
        .score-circle.poor { border-color: #ef4444; box-shadow: 0 0 30px rgba(239, 68, 68, 0.4); }
        
        .score-value {
            font-size: 60px;
            font-weight: 700;
            line-height: 1;
        }
        
        .score-max {
            font-size: 20px;
            opacity: 0.4;
        }
        
        .score-status {
            font-size: 18px;
            font-weight: 500;
            margin-top: 10px;
        }
        
        /* Stats Grid */
        .stats-mini {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }
        
        .stat-mini {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        
        .stat-mini-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-mini-value {
            font-size: 28px;
            font-weight: 700;
        }
        
        /* Chart Section */
        .chart-section {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .chart-container {
            flex: 1;
            position: relative;
            min-height: 250px;
        }
        
        /* Events Section */
        .events-section {
            grid-column: 1 / -1;
        }
        
        .events-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
        
        .event-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 4px solid;
            border-radius: 12px;
            padding: 18px;
            transition: all 0.3s ease;
        }
        
        .event-card:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(5px);
        }
        
        .event-card.flare { border-left-color: #f59e0b; }
        .event-card.quiet { border-left-color: #10b981; }
        
        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        
        .event-title {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
        }
        
        .event-badge {
            font-size: 20px;
        }
        
        .event-time {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
        }
        
        /* Buttons */
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.5);
        }
        
        .loading {
            text-align: center;
            padding: 60px;
        }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 968px) {
            .main-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="space-bg"></div>
    <div class="stars-overlay"></div>
    
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-section">
                <div class="logo-icon">🛰️</div>
                <div class="logo-text">
                    <h1>AstroGuard</h1>
                    <p>SPACE WEATHER ANALYTICS</p>
                </div>
            </div>
            <div class="header-controls">
                <div class="live-indicator">
                    <div class="live-dot"></div>
                    LIVE NASA DATA
                </div>
                <button class="settings-btn" onclick="alert('Settings panel coming soon!')">⚙️</button>
            </div>
        </div>
        
        <!-- Instrument Selector -->
        <div class="instrument-selector">
            <div class="selector-label">Select your instrument type</div>
            <div class="instruments">
                <div class="instrument-chip active" data-type="radio">📡 Radio Telescope</div>
                <div class="instrument-chip" data-type="satellite">🛰️ Satellite Sensor</div>
                <div class="instrument-chip" data-type="optical">🔭 Optical Telescope</div>
                <div class="instrument-chip" data-type="magnetometer">🧲 Magnetometer</div>
            </div>
        </div>
        
        <div id="content" class="loading">
            <div class="spinner"></div>
            <div style="color: rgba(255,255,255,0.7); margin-top: 20px;">Connecting to NASA satellites...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        const NASA_API_KEY = 'DEMO_KEY'; // REPLACE WITH YOUR REAL KEY
        let currentInstrument = 'radio';
        let chartInstance = null;
        
        // Instrument impact factors
        const IMPACT = {
            radio:       {X:95, M:70, C:30, B:5},
            satellite:   {X:80, M:55, C:20, B:5},
            optical:     {X:10, M:5,  C:2,  B:0},
            magnetometer:{X:60, M:40, C:15, B:2}
        };
        
        // Instrument selector
        document.querySelectorAll('.instrument-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.instrument-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentInstrument = chip.dataset.type;
                fetchSpaceWeather();
            });
        });
        
        async function fetchSpaceWeather() {
            try {
                const today = new Date();
                const sevenDaysAgo = new Date(today - 7 * 24 * 60 * 60 * 1000);
                
                const formatDate = (date) => date.toISOString().split('T')[0];
                const startDate = formatDate(sevenDaysAgo);
                const endDate = formatDate(today);
                
                const flareResponse = await fetch(
                    `https://api.nasa.gov/DONKI/FLR?startDate=${startDate}&endDate=${endDate}&api_key=${NASA_API_KEY}`
                );
                const flares = await flareResponse.json();
                
                displayResults(flares);
                
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="glass-card" style="text-align: center;">
                        <div style="font-size: 48px; margin-bottom: 20px;">⚠️</div>
                        <div style="font-size: 18px; margin-bottom: 15px;">Could not connect to NASA</div>
                        <div style="font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 30px;">
                            Replace DEMO_KEY with your real NASA API key from api.nasa.gov
                        </div>
                        <button class="btn" onclick="fetchSpaceWeather()">🔄 Retry Connection</button>
                    </div>
                `;
            }
        }
        
        function calculateDailyScores(flares) {
            const scores = [];
            const today = new Date();
            
            for (let i = 6; i >= 0; i--) {
                const date = new Date(today - i * 24 * 60 * 60 * 1000);
                const dateStr = date.toISOString().split('T')[0];
                
                const dayFlares = flares.filter(f => f.beginTime && f.beginTime.startsWith(dateStr));
                
                let penalty = 0;
                dayFlares.forEach(flare => {
                    const cls = flare.classType ? flare.classType[0] : 'B';
                    penalty += (IMPACT[currentInstrument][cls] || 0);
                });
                
                const score = Math.max(0, Math.min(100, 100 - penalty));
                scores.push({
                    date: date.toLocaleDateString('en', {month: 'short', day: 'numeric'}),
                    score: score
                });
            }
            
            return scores;
        }
        
        function displayResults(flares) {
            const dailyScores = calculateDailyScores(flares);
            const todayScore = dailyScores[6].score;
            const scoreClass = todayScore >= 70 ? 'good' : todayScore >= 45 ? 'moderate' : 'poor';
            const statusText = todayScore >= 70 ? 'Excellent conditions' : 
                              todayScore >= 45 ? 'Moderate activity' : 
                              'High interference risk';
            
            const recentFlares = flares.filter(f => {
                const flareDate = new Date(f.beginTime);
                const twoDaysAgo = new Date(Date.now() - 2 * 24 * 60 * 60 * 1000);
                return flareDate > twoDaysAgo;
            }).slice(0, 6);
            
            let eventsHTML = '';
            if (recentFlares.length === 0) {
                eventsHTML = `
                    <div class="event-card quiet">
                        <div class="event-header">
                            <div class="event-title">Space weather is quiet</div>
                            <div class="event-badge">✨</div>
                        </div>
                        <div class="event-time">No significant solar activity in past 48 hours</div>
                    </div>
                `;
            } else {
                recentFlares.forEach(flare => {
                    const time = new Date(flare.beginTime).toLocaleString();
                    eventsHTML += `
                        <div class="event-card flare">
                            <div class="event-header">
                                <div class="event-title">Solar Flare - Class ${flare.classType || 'Unknown'}</div>
                                <div class="event-badge">☀️</div>
                            </div>
                            <div class="event-time">${time}</div>
                        </div>
                    `;
                });
            }
            
            const progress = todayScore;
            
            document.getElementById('content').innerHTML = `
                <div class="main-grid">
                    <!-- Score Card -->
                    <div class="glass-card score-section">
                        <div class="score-label">Research Window Score</div>
                        <div class="score-display">
                            <div class="score-circle-bg" style="--progress: ${progress}%"></div>
                            <div class="score-circle ${scoreClass}">
                                <div class="score-value">${todayScore}<span class="score-max">/100</span></div>
                            </div>
                        </div>
                        <div class="score-status">${statusText}</div>
                        
                        <div class="stats-mini">
                            <div class="stat-mini">
                                <div class="stat-mini-label">Total Flares</div>
                                <div class="stat-mini-value">${flares.length}</div>
                            </div>
                            <div class="stat-mini">
                                <div class="stat-mini-label">Recent Events</div>
                                <div class="stat-mini-value">${recentFlares.length}</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Chart Card -->
                    <div class="glass-card chart-section">
                        <div class="section-title">7-Day Research Window Trend</div>
                        <div class="chart-container">
                            <canvas id="trendChart"></canvas>
                        </div>
                    </div>
                    
                    <!-- Events Section -->
                    <div class="glass-card events-section">
                        <div class="section-title">Recent Space Weather Events (Last 48 hours)</div>
                        <div class="events-list">${eventsHTML}</div>
                        <div style="text-align: center; margin-top: 25px;">
                            <button class="btn" onclick="fetchSpaceWeather()">🔄 Refresh Data</button>
                        </div>
                    </div>
                </div>
            `;
            
            // Create Chart
            if (chartInstance) chartInstance.destroy();
            
            const ctx = document.getElementById('trendChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dailyScores.map(d => d.date),
                    datasets: [{
                        label: 'Research Score',
                        data: dailyScores.map(d => d.score),
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#667eea',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            padding: 12,
                            titleColor: '#fff',
                            bodyColor: '#fff',
                            borderColor: 'rgba(255, 255, 255, 0.1)',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: 'rgba(255, 255, 255, 0.6)' }
                        },
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: 'rgba(255, 255, 255, 0.6)' }
                        }
                    }
                }
            });
        }
        
        fetchSpaceWeather();
    </script>
</body>
</html>
