<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroGuard - AI Space Weather Decision System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }
        
        /* Enhanced Space Background */
        #space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at top, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(118, 75, 162, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom left, rgba(16, 185, 129, 0.1) 0%, transparent 50%),
                linear-gradient(180deg, #000428 0%, #004e92 100%);
            z-index: 0;
        }
        
        .stars-overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(2px 2px at 60% 70%, white, transparent),
                radial-gradient(1px 1px at 50% 50%, white, transparent),
                radial-gradient(1px 1px at 80% 10%, white, transparent),
                radial-gradient(2px 2px at 90% 60%, white, transparent),
                radial-gradient(1px 1px at 10% 90%, white, transparent),
                radial-gradient(2px 2px at 30% 20%, white, transparent);
            background-size: 200% 200%;
            animation: sparkle 120s linear infinite;
            opacity: 0.6;
            z-index: 1;
        }
        
        @keyframes sparkle {
            0%, 100% { background-position: 0% 0%, 40% 40%, 80% 80%, 20% 60%, 90% 10%, 10% 90%, 30% 20%; }
            25% { background-position: 100% 100%, 60% 20%, 30% 70%, 90% 40%, 10% 90%, 50% 50%, 70% 80%; }
            50% { background-position: 50% 50%, 80% 80%, 10% 10%, 70% 30%, 40% 60%, 90% 20%, 20% 40%; }
            75% { background-position: 20% 80%, 30% 30%, 60% 40%, 10% 80%, 80% 20%, 40% 60%, 60% 10%; }
        }
        
        /* Shooting stars */
        .shooting-star {
            position: fixed;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 4px white;
            animation: shoot 3s linear infinite;
            opacity: 0;
        }
        
        @keyframes shoot {
            0% { transform: translateX(0) translateY(0); opacity: 1; }
            100% { transform: translateX(-300px) translateY(300px); opacity: 0; }
        }
        
        .container {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        /* Alert Banner */
        .alert-banner {
            background: rgba(239, 68, 68, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 16px;
            padding: 16px 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideDown 0.5s ease;
        }
        
        .alert-banner.warning {
            background: rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.4);
        }
        
        .alert-banner.success {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.4);
        }
        
        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .alert-icon {
            font-size: 24px;
            animation: pulse 2s infinite;
        }
        
        .alert-content {
            flex: 1;
        }
        
        .alert-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
        }
        
        .alert-text {
            font-size: 13px;
            opacity: 0.9;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px 30px;
        }
        
        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo-icon {
            font-size: 40px;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        
        .logo-text h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }
        
        .logo-text p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1.5px;
        }
        
        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            color: #10b981;
            font-weight: 600;
        }
        
        .live-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px #10b981; }
            50% { opacity: 0.3; box-shadow: 0 0 0px #10b981; }
        }
        
        .update-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
        }
        
        /* Instrument Selector */
        .instrument-selector {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 30px;
        }
        
        .selector-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .instruments {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .instrument-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .instrument-chip:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .instrument-chip.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .glass-card {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            transition: all 0.3s ease;
        }
        
        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        /* Score Card */
        .score-section {
            text-align: center;
        }
        
        .score-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        
        .score-display {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 25px;
        }
        
        .score-circle {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border: 4px solid;
        }
        
        .score-circle.good { 
            border-color: #10b981; 
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.5), inset 0 0 40px rgba(16, 185, 129, 0.1);
        }
        .score-circle.moderate { 
            border-color: #f59e0b; 
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.5), inset 0 0 40px rgba(245, 158, 11, 0.1);
        }
        .score-circle.poor { 
            border-color: #ef4444; 
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.5), inset 0 0 40px rgba(239, 68, 68, 0.1);
        }
        
        .score-value {
            font-size: 64px;
            font-weight: 700;
            line-height: 1;
        }
        
        .score-max {
            font-size: 22px;
            opacity: 0.4;
        }
        
        .score-status {
            font-size: 18px;
            font-weight: 500;
            margin-top: 10px;
        }
        
        /* Stats Grid */
        .stats-mini {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }
        
        .stat-mini {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        
        .stat-mini-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-mini-value {
            font-size: 28px;
            font-weight: 700;
        }
        
        /* Prediction Section */
        .prediction-card {
            grid-column: 1 / -1;
        }
        
        .prediction-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .day-forecast {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .day-forecast:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-5px);
        }
        
        .day-forecast.best {
            border: 2px solid #10b981;
            background: rgba(16, 185, 129, 0.1);
        }
        
        .day-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 12px;
        }
        
        .day-score {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .day-status {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .best-badge {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
            display: inline-block;
        }
        
        /* Chart Section */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .chart-container {
            position: relative;
            height: 300px;
        }
        
        /* Events */
        .events-section {
            grid-column: 1 / -1;
        }
        
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
        
        .event-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 4px solid;
            border-radius: 12px;
            padding: 18px;
            transition: all 0.3s ease;
        }
        
        .event-card:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(5px);
        }
        
        .event-card.flare { border-left-color: #f59e0b; }
        .event-card.quiet { border-left-color: #10b981; }
        
        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        
        .event-title {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
        }
        
        .event-badge {
            font-size: 20px;
        }
        
        .event-time {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.5);
        }
        
        @media (max-width: 968px) {
            .main-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="space-bg"></div>
    <div class="stars-overlay"></div>
    
    <!-- Shooting stars -->
    <div class="shooting-star" style="top: 10%; right: 20%; animation-delay: 2s;"></div>
    <div class="shooting-star" style="top: 30%; right: 60%; animation-delay: 5s;"></div>
    <div class="shooting-star" style="top: 50%; right: 10%; animation-delay: 8s;"></div>
    
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-section">
                <div class="logo-icon">🛰️</div>
                <div class="logo-text">
                    <h1>AstroGuard</h1>
                    <p>AI SPACE WEATHER DECISION SYSTEM</p>
                </div>
            </div>
            <div class="header-controls">
                <div class="update-time" id="update-time">Updated: --:--</div>
                <div class="live-indicator">
                    <div class="live-dot"></div>
                    AUTO-REFRESH
                </div>
            </div>
        </div>
        
        <!-- Alert Banner (will be dynamically inserted) -->
        <div id="alert-container"></div>
        
        <!-- Instrument Selector -->
        <div class="instrument-selector">
            <div class="selector-label">Select your instrument type</div>
            <div class="instruments">
                <div class="instrument-chip active" data-type="radio">📡 Radio Telescope</div>
                <div class="instrument-chip" data-type="satellite">🛰️ Satellite Sensor</div>
                <div class="instrument-chip" data-type="optical">🔭 Optical Telescope</div>
                <div class="instrument-chip" data-type="magnetometer">🧲 Magnetometer</div>
            </div>
        </div>
        
        <div id="content"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        const NASA_API_KEY = 'US0yyc0uLO3wOPg5wLiCatsMHmVqisoOEdcAMxcx'; // ⚠️ REPLACE WITH YOUR REAL KEY
        let currentInstrument = 'radio';
        let chartInstance = null;
        let cachedFlares = [];
        
        // SMART INSTRUMENT SCORING (Different for each instrument!)
        const IMPACT = {
            radio: {
                X: 95, M: 70, C: 30, B: 5,
                description: 'HF Radio Telescope'
            },
            satellite: {
                X: 80, M: 55, C: 20, B: 5,
                description: 'Satellite Sensor'
            },
            optical: {
                X: 10, M: 5, C: 2, B: 0,
                description: 'Optical Telescope'
            },
            magnetometer: {
                X: 60, M: 40, C: 15, B: 2,
                description: 'Magnetometer'
            }
        };
        
        // Update time display
        function updateTime() {
            const now = new Date();
            document.getElementById('update-time').textContent = 
                `Updated: ${now.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}`;
        }
        
        // Instrument selector
        document.querySelectorAll('.instrument-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.instrument-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentInstrument = chip.dataset.type;
                if (cachedFlares.length > 0) displayResults(cachedFlares);
            });
        });
        
        // Smart Alert System
        function showAlert(score, nextBestDay) {
            const container = document.getElementById('alert-container');
            let alertHTML = '';
            
            if (score >= 80) {
                alertHTML = `
                    <div class="alert-banner success">
                        <div class="alert-icon">🚀</div>
                        <div class="alert-content">
                            <div class="alert-title">Perfect Observation Window!</div>
                            <div class="alert-text">Excellent conditions detected. Ideal time for ${IMPACT[currentInstrument].description} observations.</div>
                        </div>
                    </div>
                `;
            } else if (score < 40) {
                alertHTML = `
                    <div class="alert-banner">
                        <div class="alert-icon">⚠️</div>
                        <div class="alert-content">
                            <div class="alert-title">Warning: High Interference Risk</div>
                            <div class="alert-text">Active space weather detected. Consider postponing critical observations. ${nextBestDay}</div>
                        </div>
                    </div>
                `;
            } else if (score < 60) {
                alertHTML = `
                    <div class="alert-banner warning">
                        <div class="alert-icon">⚡</div>
                        <div class="alert-content">
                            <div class="alert-title">Moderate Space Weather Activity</div>
                            <div class="alert-text">Some interference possible. Monitor conditions closely.</div>
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = alertHTML;
        }
        
        // Calculate score for specific date and instrument
        function calculateScoreForDate(flares, date, instrument) {
            const dateStr = date.toISOString().split('T')[0];
            const dayFlares = flares.filter(f => f.beginTime && f.beginTime.startsWith(dateStr));
            
            let penalty = 0;
            dayFlares.forEach(flare => {
                const cls = flare.classType ? flare.classType[0] : 'B';
                penalty += (IMPACT[instrument][cls] || 0);
            });
            
            return Math.max(0, Math.min(100, 100 - penalty));
        }
        
        // 3-DAY PREDICTION
        function predict3Days(flares) {
            const predictions = [];
            const today = new Date();
            
            for (let i = 0; i <= 2; i++) {
                const date = new Date(today.getTime() + i * 24 * 60 * 60 * 1000);
                const score = calculateScoreForDate(flares, date, currentInstrument);
                
                predictions.push({
                    date: date,
                    label: i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : date.toLocaleDateString('en', {weekday: 'short', month: 'short', day: 'numeric'}),
                    score: score,
                    status: score >= 70 ? 'Excellent' : score >= 45 ? 'Moderate' : 'Poor'
                });
            }
            
            return predictions;
        }
        
        // Find best observation time in next 7 days
        function findBestTime(flares) {
            let bestDay = null;
            let bestScore = -1;
            
            for (let i = 0; i < 7; i++) {
                const date = new Date(Date.now() + i * 24 * 60 * 60 * 1000);
                const score = calculateScoreForDate(flares, date, currentInstrument);
                
                if (score > bestScore) {
                    bestScore = score;
                    bestDay = {
                        date: date,
                        score: score,
                        daysAway: i
                    };
                }
            }
            
            return bestDay;
        }
        
        // 7-day historical trend
        function calculate7DayTrend(flares) {
            const scores = [];
            const today = new Date();
            
            for (let i = 6; i >= 0; i--) {
                const date = new Date(today - i * 24 * 60 * 60 * 1000);
                const score = calculateScoreForDate(flares, date, currentInstrument);
                scores.push({
                    date: date.toLocaleDateString('en', {month: 'short', day: 'numeric'}),
                    score: score
                });
            }
            
            return scores;
        }
        
        async function fetchSpaceWeather() {
            try {
                const today = new Date();
                const sevenDaysAgo = new Date(today - 7 * 24 * 60 * 60 * 1000);
                
                const formatDate = (date) => date.toISOString().split('T')[0];
                const startDate = formatDate(sevenDaysAgo);
                const endDate = formatDate(today);
                
                const flareResponse = await fetch(
                    `https://api.nasa.gov/DONKI/FLR?startDate=${startDate}&endDate=${endDate}&api_key=${NASA_API_KEY}`
                );
                const flares = await flareResponse.json();
                
                cachedFlares = flares;
                displayResults(flares);
                updateTime();
                
            } catch (error) {
                console.error('NASA API Error:', error);
            }
        }
        
        function displayResults(flares) {
            const todayScore = calculateScoreForDate(flares, new Date(), currentInstrument);
            const predictions = predict3Days(flares);
            const bestTime = findBestTime(flares);
            const trend = calculate7DayTrend(flares);
            
            const scoreClass = todayScore >= 70 ? 'good' : todayScore >= 45 ? 'moderate' : 'poor';
            const statusText = todayScore >= 70 ? 'Excellent conditions' : 
                              todayScore >= 45 ? 'Moderate activity' : 
                              'High interference risk';
            
            // Alert System
            const nextBestMsg = bestTime.daysAway === 0 ? '' : 
                `Next optimal window: ${bestTime.date.toLocaleDateString('en', {weekday: 'long', month: 'short', day: 'numeric'})} (${bestTime.daysAway} days away)`;
            showAlert(todayScore, nextBestMsg);
            
            const recentFlares = flares.filter(f => {
                const flareDate = new Date(f.beginTime);
                const twoDaysAgo = new Date(Date.now() - 2 * 24 * 60 * 60 * 1000);
                return flareDate > twoDaysAgo;
            }).slice(0, 6);
            
            let eventsHTML = '';
            if (recentFlares.length === 0) {
                eventsHTML = `
                    <div class="event-card quiet">
                        <div class="event-header">
                            <div class="event-title">Space weather is quiet</div>
                            <div class="event-badge">✨</div>
                        </div>
                        <div class="event-time">No significant solar activity in past 48 hours</div>
                    </div>
                `;
            } else {
                recentFlares.forEach(flare => {
                    const time = new Date(flare.beginTime).toLocaleString();
                    eventsHTML += `
                        <div class="event-card flare">
                            <div class="event-header">
                                <div class="event-title">Solar Flare - Class ${flare.classType || 'Unknown'}</div>
                                <div class="event-badge">☀️</div>
                            </div>
                            <div class="event-time">${time}</div>
                        </div>
                    `;
                });
            }
            
            let predictionHTML = '';
            predictions.forEach((pred, idx) => {
                const isBest = pred.score === Math.max(...predictions.map(p => p.score));
                predictionHTML += `
                    <div class="day-forecast ${isBest && idx > 0 ? 'best' : ''}">
                        <div class="day-label">${pred.label}</div>
                        <div class="day-score" style="color: ${pred.score >= 70 ? '#10b981' : pred.score >= 45 ? '#f59e0b' : '#ef4444'}">${pred.score}</div>
                        <div class="day-status">${pred.status}</div>
                        ${isBest && idx > 0 ? '<div class="best-badge">⭐ Best Window</div>' : ''}
                    </div>
                `;
            });
            
            document.getElementById('content').innerHTML = `
                <!-- Prediction Section -->
                <div class="glass-card prediction-card">
                    <div class="section-title">📅 3-Day Forecast & Best Observation Time</div>
                    <div class="prediction-grid">
                        ${predictionHTML}
                    </div>
                </div>
                
                <div class="main-grid">
                    <!-- Score Card -->
                    <div class="glass-card score-section">
                        <div class="score-label">Current Research Score</div>
                        <div class="score-display">
                            <div class="score-circle ${scoreClass}">
                                <div class="score-value">${todayScore}<span class="score-max">/100</span></div>
                            </div>
                        </div>
                        <div class="score-status">${statusText}</div>
                        
                        <div class="stats-mini">
                            <div class="stat-mini">
                                <div class="stat-mini-label">Total Flares</div>
                                <div class="stat-mini-value">${flares.length}</div>
                            </div>
                            <div class="stat-mini">
                                <div class="stat-mini-label">Recent Events</div>
                                <div class="stat-mini-value">${recentFlares.length}</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Chart Card -->
                    <div class="glass-card">
                        <div class="section-title">📊 7-Day Research Window Trend</div>
                        <div class="chart-container">
                            <canvas id="trendChart"></canvas>
                        </div>
                    </div>
                    
                    <!-- Events Section -->
                    <div class="glass-card events-section">
                        <div class="section-title">🌟 Recent Space Weather Events (Last 48 hours)</div>
                        <div class="events-grid">${eventsHTML}</div>
                    </div>
                </div>
            `;
            
            // Create Enhanced Chart with Zones
            if (chartInstance) chartInstance.destroy();
            
            const ctx = document.getElementById('trendChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: trend.map(d => d.date),
                    datasets: [{
                        label: 'Research Score',
                        data: trend.map(d => d.score),
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#667eea',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 6,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.9)',
                            padding: 12,
                            titleColor: '#fff',
                            bodyColor: '#fff',
                            borderColor: 'rgba(255, 255, 255, 0.2)',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            grid: { 
                                color: function(context) {
                                    const val = context.tick.value;
                                    if (val === 70) return 'rgba(16, 185, 129, 0.3)';
                                    if (val === 45) return 'rgba(245, 158, 11, 0.3)';
                                    return 'rgba(255, 255, 255, 0.05)';
                                }
                            },
                            ticks: { color: 'rgba(255, 255, 255, 0.6)' }
                        },
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: 'rgba(255, 255, 255, 0.6)' }
                        }
                    }
                }
            });
        }
        
        // AUTO-REFRESH EVERY 60 SECONDS
        fetchSpaceWeather();
        setInterval(fetchSpaceWeather, 60000);
    </script>
</body>
</html>
