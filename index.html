<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroGuard Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system;color:#fff;overflow-x:hidden}

/* 🌌 Background */
body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:url('https://images-assets.nasa.gov/image/PIA01322/PIA01322~orig.jpg') center/cover no-repeat;
    z-index:-2;
}
body::after{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    backdrop-filter:blur(25px);
    background:rgba(0,0,0,0.5);
    z-index:-1;
}

/* Glass */
.glass{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:20px;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
}

.header{
    display:flex;
    justify-content:space-between;
    margin:20px;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    padding:20px;
}

.card{padding:20px;text-align:center}
.big{font-size:30px;font-weight:bold}

.score{text-align:center;padding:30px}
.circle{
    width:180px;height:180px;border-radius:50%;
    border:3px solid #fff;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;margin:auto;
}

/* ALERT */
.alert{
    margin:20px;
    padding:15px;
    border-radius:12px;
    background:rgba(255,0,0,0.2);
}

/* MAP */
.map{
    height:200px;
    margin:20px;
    background:linear-gradient(to top, #001, #112);
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:20px;
}
</style>
</head>

<body>

<div class="header glass">
    <h2>🛰️ AstroGuard</h2>
    <div id="time">...</div>
</div>

<div id="alert"></div>

<div class="grid" id="indicators"></div>

<div class="glass score" id="main"></div>

<div class="glass map" id="map"></div>

<script>
const NASA_API_KEY="US0yyc0uLO3wOPg5wLiCatsMHmVqisoOEdcAMxcx";

/* G SCALE */
function getGScale(kp){
    if(kp>=9) return "G5 Extreme";
    if(kp>=8) return "G4 Severe";
    if(kp>=7) return "G3 Strong";
    if(kp>=6) return "G2 Moderate";
    if(kp>=5) return "G1 Minor";
    return "Quiet";
}

/* SCORE */
function calcScore(flares,kp,wind,cme){
    let score=100;
    const w={X:40,M:25,C:8,B:1};

    flares.forEach(f=>{
        const t=f.classType?f.classType[0]:'B';
        score-=w[t]||0;
    });

    if(kp>=7) score-=30;
    else if(kp>=5) score-=20;

    if(wind>700) score-=20;
    else if(wind>500) score-=10;

    score-=Math.min(cme,3)*25;

    return Math.max(0,Math.round(score));
}

/* 🔮 Prediction */
function predict(score,kp){
    let future=score - (kp*2);
    return Math.max(0,Math.min(100,Math.round(future)));
}

/* 🚨 Alerts */
function getAlert(score,kp){
    if(kp>=7) return "⚠️ Geomagnetic Storm Warning!";
    if(score>80) return "✅ Perfect observation conditions";
    if(score<40) return "⚡ High interference expected";
    return "";
}

/* 🌍 Aurora Map (simple logic) */
function getAuroraZone(kp){
    if(kp>=7) return "Visible in mid-latitudes 🌍";
    if(kp>=5) return "Visible near poles ❄️";
    return "Not visible";
}

/* MAIN LOAD */
async function load(){

    document.getElementById("indicators").innerHTML="Loading...";
    document.getElementById("main").innerHTML="🚀 Loading space data...";

    try{
        const [flareRes,cmeRes,kpRes,windRes]=await Promise.all([
            fetch(`https://api.nasa.gov/DONKI/FLR?api_key=${NASA_API_KEY}`),
            fetch(`https://api.nasa.gov/DONKI/CME?api_key=${NASA_API_KEY}`),
            fetch("https://api.allorigins.win/raw?url=https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"),
            fetch("https://api.allorigins.win/raw?url=https://services.swpc.noaa.gov/products/solar-wind/plasma-7-day.json")
        ]);

        const flares=await flareRes.json();
        const cmes=await cmeRes.json();
        const kpData=await kpRes.json();
        const windData=await windRes.json();

        const kp=parseFloat(kpData[kpData.length-1][1]);
        const solarWind=parseFloat(windData[windData.length-1][2]);

        const recentFlares=flares.slice(-5);
        const cmeCount=cmes.length;

        const score=calcScore(recentFlares,kp,solarWind,cmeCount);
        const future=predict(score,kp);

        /* ALERT */
        document.getElementById("alert").innerHTML=
            getAlert(score,kp)?`<div class="alert glass">${getAlert(score,kp)}</div>`:"";

        /* INDICATORS */
        document.getElementById("indicators").innerHTML=`
        <div class="glass card"><div>Kp</div><div class="big">${kp}</div><small>${getGScale(kp)}</small></div>
        <div class="glass card"><div>Wind</div><div class="big">${solarWind}</div><small>km/s</small></div>
        <div class="glass card"><div>Flares</div><div class="big">${recentFlares.length}</div></div>
        <div class="glass card"><div>CME</div><div class="big">${cmeCount}</div></div>
        `;

        /* MAIN */
        document.getElementById("main").innerHTML=`
        <div class="circle">
            <div style="font-size:45px">${score}</div>
            <small>/100</small>
        </div>

        <h3 style="margin-top:15px">
        ${score>70?"Excellent":score>40?"Moderate":"Poor"}
        </h3>

        <div style="margin-top:10px">🔮 Next 24h: ${future}/100</div>

        <div style="font-size:12px;opacity:0.6;margin-top:10px">
        📡 NASA + NOAA Real Data
        </div>
        `;

        /* MAP */
        document.getElementById("map").innerHTML=
            `<div>${getAuroraZone(kp)}</div>`;

        /* CACHE */
        localStorage.setItem("astroCache",JSON.stringify({kp,solarWind,score}));

    }catch(e){
        const cache=JSON.parse(localStorage.getItem("astroCache"));
        if(cache){
            document.getElementById("main").innerHTML=
                "⚡ Offline mode (cached data)";
        }
    }

    document.getElementById("time").innerText=new Date().toLocaleTimeString();
}

load();
setInterval(load,60000);
</script>

</body>
</html>
