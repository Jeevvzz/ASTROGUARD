<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroGuard NASA UI</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:system-ui;
    background:#05070d;
    color:#fff;
}

/* 🌌 NASA DARK SPACE */
body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at center, rgba(0,50,120,0.3), transparent 60%),
        url('https://images-assets.nasa.gov/image/PIA01322/PIA01322~orig.jpg') center/cover;
    opacity:0.4;
    z-index:-1;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    padding:20px;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    padding:20px;
}

/* CARD */
.card{
    background:#0c111b;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    padding:20px;
    text-align:center;
}

.big{font-size:28px;font-weight:bold}

/* SCORE */
.score{
    text-align:center;
    padding:30px;
}
.circle{
    width:160px;height:160px;border-radius:50%;
    border:3px solid #10b981;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    margin:auto;
}

/* ALERT */
.alert{
    margin:20px;
    padding:12px;
    border-radius:10px;
    background:#7f1d1d;
}

/* GRAPH */
.chart-box{
    margin:20px;
    padding:20px;
    background:#0c111b;
    border-radius:12px;
}

/* MAP */
.map{
    margin:20px;
    padding:20px;
    background:#0c111b;
    border-radius:12px;
    text-align:center;
}
</style>
</head>

<body>

<div class="header">
    <h2>🛰️ AstroGuard</h2>
    <div id="time"></div>
</div>

<div id="alert"></div>

<div class="grid" id="indicators"></div>

<div class="score" id="main"></div>

<div class="chart-box">
    <canvas id="chart"></canvas>
</div>

<div class="map" id="map"></div>

<script>
const NASA_API_KEY="US0yyc0uLO3wOPg5wLiCatsMHmVqisoOEdcAMxcx";

/* ⚡ FAST FETCH */
async function safeFetch(url, timeout=3000){
    return new Promise(resolve=>{
        const timer=setTimeout(()=>resolve(null),timeout);
        fetch(url)
        .then(r=>r.json())
        .then(d=>{clearTimeout(timer);resolve(d);})
        .catch(()=>{clearTimeout(timer);resolve(null);});
    });
}

/* G SCALE */
function getGScale(kp){
    if(kp>=7) return "Storm";
    if(kp>=5) return "Active";
    return "Quiet";
}

/* SCORE */
function calcScore(flares,kp,wind,cme){
    let score=100;
    const w={X:40,M:25,C:8,B:1};

    flares.forEach(f=>{
        const t=f?.classType?.[0]||'B';
        score-=w[t]||0;
    });

    if(kp>=7) score-=30;
    else if(kp>=5) score-=20;

    if(wind>700) score-=20;
    else if(wind>500) score-=10;

    score-=Math.min(cme,2)*15;

    return Math.max(0,Math.round(score));
}

/* LOAD */
async function load(){

    document.getElementById("indicators").innerHTML="⚡ Loading...";
    document.getElementById("main").innerHTML="🚀 Fetching data...";

    try{
        const [flareData,cmeData,kpData,windData]=await Promise.all([
            safeFetch(`https://api.nasa.gov/DONKI/FLR?api_key=${NASA_API_KEY}`),
            safeFetch(`https://api.nasa.gov/DONKI/CME?api_key=${NASA_API_KEY}`),
            safeFetch("https://api.allorigins.win/raw?url=https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"),
            safeFetch("https://api.allorigins.win/raw?url=https://services.swpc.noaa.gov/products/solar-wind/plasma-7-day.json")
        ]);

        const kp = kpData?.length>1 ? parseFloat(kpData.at(-1)[1])||3 : 3;
        const wind = windData?.length>1 ? parseFloat(windData.at(-1)[2])||400 : 400;

        const now=new Date();
        const last48h=new Date(now-48*60*60*1000);

        const flares = Array.isArray(flareData)
            ? flareData.filter(f=>new Date(f.beginTime)>last48h)
            : [];

        const cmes = Array.isArray(cmeData)
            ? cmeData.filter(c=>new Date(c.startTime)>last48h)
            : [];

        const score = calcScore(flares,kp,wind,cmes.length);

        /* ALERT */
        let alert="";
        if(kp>=7) alert="⚠️ Storm Warning";
        else if(score>80) alert="✅ Excellent Conditions";
        else if(score<40) alert="⚡ Interference";

        document.getElementById("alert").innerHTML=
            alert?`<div class="alert">${alert}</div>`:"";

        /* INDICATORS */
        document.getElementById("indicators").innerHTML=`
        <div class="card"><div>Kp</div><div class="big">${kp}</div><small>${getGScale(kp)}</small></div>
        <div class="card"><div>Wind</div><div class="big">${wind}</div><small>km/s</small></div>
        <div class="card"><div>Flares</div><div class="big">${flares.length}</div></div>
        <div class="card"><div>CME</div><div class="big">${cmes.length}</div></div>
        `;

        /* SCORE */
        document.getElementById("main").innerHTML=`
        <div class="circle" style="border-color:${score>70?'#10b981':score>40?'#f59e0b':'#ef4444'}">
            <div style="font-size:45px">${score}</div>
            <small>/100</small>
        </div>
        <h2>${score>70?"Excellent":score>40?"Moderate":"Poor"}</h2>
        `;

        /* MAP */
        document.getElementById("map").innerHTML=
            kp>=7?"🌍 Aurora visible":
            kp>=5?"❄️ Near poles":
            "Not visible";

        /* GRAPH */
        const ctx=document.getElementById("chart");

        new Chart(ctx,{
            type:"line",
            data:{
                labels:["Now"],
                datasets:[{
                    label:"Score",
                    data:[score],
                    borderColor:"#10b981",
                    tension:0.4
                }]
            }
        });

    }catch(e){
        document.getElementById("main").innerHTML="❌ Failed to load";
    }

    document.getElementById("time").innerText=new Date().toLocaleTimeString();
}

load();
setInterval(load,60000);
</script>

</body>
</html>
