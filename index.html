<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroGuard Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    color:#fff;
    overflow-x:hidden;
}

/* 🌌 REAL GALAXY BACKGROUND */
body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:url('https://images-assets.nasa.gov/image/PIA01322/PIA01322~orig.jpg') center/cover no-repeat;
    z-index:-2;
}

/* Blur overlay */
body::after{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    backdrop-filter:blur(25px);
    background:rgba(0,0,0,0.4);
    z-index:-1;
}

/* GLASS UI */
.glass{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:20px;
    box-shadow:0 8px 40px rgba(0,0,0,0.4);
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    padding:20px 30px;
    margin:20px;
}

h1{
    font-size:26px;
    background:linear-gradient(90deg,#fff,#aaa);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    padding:20px;
}

.card{
    padding:20px;
    text-align:center;
}

.big{
    font-size:32px;
    font-weight:700;
}

/* SCORE */
.score{
    text-align:center;
    padding:30px;
}

.circle{
    width:180px;
    height:180px;
    border-radius:50%;
    border:3px solid #fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    margin:auto;
}

small{opacity:0.7}
</style>
</head>

<body>

<div class="header glass">
    <h1>🛰️ AstroGuard</h1>
    <div id="time">Loading...</div>
</div>

<div class="grid" id="indicators"></div>

<div class="glass score" id="main"></div>

<script>
const NASA_API_KEY="US0yyc0uLO3wOPg5wLiCatsMHmVqisoOEdcAMxcx";

/* G SCALE */
function getGScale(kp){
    if(kp>=9) return "G5 Extreme";
    if(kp>=8) return "G4 Severe";
    if(kp>=7) return "G3 Strong";
    if(kp>=6) return "G2 Moderate";
    if(kp>=5) return "G1 Minor";
    return "Quiet";
}

/* SCORE */
function calcScore(flares,kp,wind,cme){
    let score=100;

    const weight={X:40,M:25,C:8,B:1};

    flares.forEach(f=>{
        const t=f.classType?f.classType[0]:'B';
        score-=weight[t]||0;
    });

    if(kp>=7) score-=30;
    else if(kp>=5) score-=20;

    if(wind>700) score-=20;
    else if(wind>500) score-=10;

    score-=Math.min(cme,3)*25;

    return Math.max(0,Math.round(score));
}

async function load(){

    /* NASA DATA */
    const flareRes=await fetch(`https://api.nasa.gov/DONKI/FLR?api_key=${NASA_API_KEY}`);
    const flares=await flareRes.json();

    const cmeRes=await fetch(`https://api.nasa.gov/DONKI/CME?api_key=${NASA_API_KEY}`);
    const cmes=await cmeRes.json();

    /* NOAA REAL DATA */
    const kpRes=await fetch("https://api.allorigins.win/raw?url=https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json");
    const kpData=await kpRes.json();
    const kp=parseFloat(kpData[kpData.length-1][1]);

    const windRes=await fetch("https://api.allorigins.win/raw?url=https://services.swpc.noaa.gov/products/solar-wind/plasma-7-day.json");
    const windData=await windRes.json();
    const solarWind=parseFloat(windData[windData.length-1][2]);

    const recentFlares=flares.slice(-5);
    const cmeCount=cmes.length;

    const score=calcScore(recentFlares,kp,solarWind,cmeCount);
    const confidence=(recentFlares.length>0?80:95)-(kp*2);

    /* UI */
    document.getElementById("indicators").innerHTML=`
    <div class="glass card">
        <div>Kp Index</div>
        <div class="big">${kp}</div>
        <small>${getGScale(kp)}</small>
    </div>
    <div class="glass card">
        <div>Solar Wind</div>
        <div class="big">${solarWind}</div>
        <small>km/s</small>
    </div>
    <div class="glass card">
        <div>Flares</div>
        <div class="big">${recentFlares.length}</div>
    </div>
    <div class="glass card">
        <div>CME</div>
        <div class="big">${cmeCount}</div>
    </div>
    `;

    document.getElementById("main").innerHTML=`
    <div class="circle">
        <div style="font-size:50px">${score}</div>
        <small>/100</small>
    </div>

    <h3 style="margin-top:20px">
    ${score>70?"Excellent":score>40?"Moderate":"Poor"} Conditions
    </h3>

    <div style="margin-top:15px;opacity:0.8">
    Confidence: ${confidence}%
    </div>

    <div style="margin-top:15px;font-size:12px;opacity:0.6">
    📡 Data Sources: NASA DONKI + NOAA SWPC (Real-time)
    </div>
    `;

    document.getElementById("time").innerText=
        new Date().toLocaleTimeString();
}

load();
setInterval(load,60000);
</script>

</body>
</html>
