<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroGuard - NASA Space Weather</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #000;
    color: #fff;
    overflow-x: hidden;
}

/* NASA Galaxy Background */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
        radial-gradient(ellipse at center, rgba(30, 60, 114, 0.4) 0%, transparent 70%),
        radial-gradient(2px 2px at 20% 30%, white, transparent),
        radial-gradient(2px 2px at 60% 70%, white, transparent),
        radial-gradient(1px 1px at 50% 50%, white, transparent),
        radial-gradient(1px 1px at 80% 10%, white, transparent),
        radial-gradient(2px 2px at 90% 60%, white, transparent),
        #0a0e1a;
    background-size: 100% 100%, 200% 200%, 200% 200%, 200% 200%, 200% 200%, 200% 200%;
    z-index: -1;
    animation: twinkle 100s linear infinite;
}

@keyframes twinkle {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.8; }
}

/* Galaxy Image Center */
.galaxy {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(ellipse at center, rgba(100, 50, 200, 0.15) 0%, transparent 70%);
    border-radius: 50%;
    z-index: -1;
    opacity: 0.3;
    filter: blur(60px);
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

/* Header - NASA Style */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    background: rgba(10, 14, 26, 0.8);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    margin-bottom: 20px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.logo-icon { font-size: 32px; }

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #10b981;
}

.dot {
    width: 6px;
    height: 6px;
    background: #10b981;
    border-radius: 50%;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

/* Alert Banner */
.alert {
    padding: 16px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    font-weight: 500;
}

.alert.success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); }
.alert.warning { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); }
.alert.danger { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); }

/* Indicators Grid */
.indicators {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.indicator {
    background: rgba(10, 14, 26, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
}

.indicator-label {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.indicator-value {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 4px;
}

.indicator-status {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.7);
}

/* Main Grid */
.main-grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 20px;
    margin-bottom: 20px;
}

.card {
    background: rgba(10, 14, 26, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 24px;
}

/* Score Circle */
.score-section { text-align: center; }

.score-circle {
    width: 180px;
    height: 180px;
    margin: 20px auto;
    border-radius: 50%;
    border: 4px solid;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.4);
}

.score-circle.good { border-color: #10b981; box-shadow: 0 0 30px rgba(16, 185, 129, 0.4); }
.score-circle.moderate { border-color: #f59e0b; box-shadow: 0 0 30px rgba(245, 158, 11, 0.4); }
.score-circle.poor { border-color: #ef4444; box-shadow: 0 0 30px rgba(239, 68, 68, 0.4); }

.score-value { font-size: 56px; font-weight: 700; line-height: 1; }
.score-max { font-size: 18px; opacity: 0.5; }
.score-status { font-size: 16px; margin-top: 10px; color: rgba(255, 255, 255, 0.8); }

/* Chart */
.chart-container { position: relative; height: 280px; }

/* Prediction */
.prediction-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 15px;
}

.day-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
}

.day-card.best { border: 2px solid #10b981; background: rgba(16, 185, 129, 0.1); }

.day-label { font-size: 12px; color: rgba(255, 255, 255, 0.6); margin-bottom: 8px; }
.day-score { font-size: 36px; font-weight: 700; }
.day-status { font-size: 12px; color: rgba(255, 255, 255, 0.7); margin-top: 4px; }

.section-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 15px;
    color: rgba(255, 255, 255, 0.9);
}

@media (max-width: 768px) {
    .main-grid { grid-template-columns: 1fr; }
    .prediction-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="galaxy"></div>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">🛰️</div>
            <div>AstroGuard</div>
        </div>
        <div class="status">
            <div class="dot"></div>
            <span id="time">Loading...</span>
        </div>
    </div>

    <!-- Alert -->
    <div id="alert"></div>

    <!-- Indicators -->
    <div class="indicators" id="indicators">
        <div class="indicator"><div class="indicator-label">Loading</div><div class="indicator-value">--</div></div>
        <div class="indicator"><div class="indicator-label">Loading</div><div class="indicator-value">--</div></div>
        <div class="indicator"><div class="indicator-label">Loading</div><div class="indicator-value">--</div></div>
        <div class="indicator"><div class="indicator-label">Loading</div><div class="indicator-value">--</div></div>
    </div>

    <!-- Main Content -->
    <div class="main-grid">
        <!-- Score -->
        <div class="card score-section">
            <div class="section-title">Research Score</div>
            <div id="scoreDisplay">
                <div class="score-circle good">
                    <div class="score-value">--<span class="score-max">/100</span></div>
                </div>
                <div class="score-status">Analyzing...</div>
            </div>
        </div>

        <!-- Graph -->
        <div class="card">
            <div class="section-title">7-Day Trend</div>
            <div class="chart-container">
                <canvas id="chart"></canvas>
            </div>
        </div>
    </div>

    <!-- Prediction -->
    <div class="card">
        <div class="section-title">3-Day Forecast</div>
        <div class="prediction-grid" id="prediction">
            <div class="day-card"><div class="day-label">Loading...</div></div>
            <div class="day-card"><div class="day-label">Loading...</div></div>
            <div class="day-card"><div class="day-label">Loading...</div></div>
        </div>
    </div>
</div>

<script>
const NASA_KEY = 'US0yyc0uLO3wOPg5wLiCatsMHmVqisoOEdcAMxcx'; // Replace with your real key
let chart = null;

// Fast fetch with timeout
async function safeFetch(url, timeout = 3000) {
    return Promise.race([
        fetch(url).then(r => r.json()),
        new Promise((_, reject) => setTimeout(() => reject('timeout'), timeout))
    ]).catch(() => null);
}

// Calculate score
function calcScore(flares, kp, wind, cme) {
    let score = 100;
    
    flares.forEach(f => {
        const type = f?.classType?.[0] || 'B';
        if (type === 'X') score -= 35;
        else if (type === 'M') score -= 22;
        else if (type === 'C') score -= 10;
        else score -= 2;
    });
    
    if (kp >= 7) score -= 30;
    else if (kp >= 5) score -= 18;
    else if (kp >= 3) score -= 8;
    
    if (wind > 700) score -= 22;
    else if (wind > 500) score -= 12;
    else if (wind > 400) score -= 5;
    
    score -= Math.min(cme, 3) * 12;
    
    return Math.max(0, Math.min(100, Math.round(score)));
}

// Main load function
async function load() {
    try {
        // Update time immediately
        document.getElementById('time').textContent = new Date().toLocaleTimeString();
        
        // Parallel fetch all data
        const [flareData, cmeData, kpData, windData] = await Promise.all([
            safeFetch(`https://api.nasa.gov/DONKI/FLR?api_key=${NASA_KEY}`),
            safeFetch(`https://api.nasa.gov/DONKI/CME?api_key=${NASA_KEY}`),
            safeFetch('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json'),
            safeFetch('https://services.swpc.noaa.gov/products/solar-wind/plasma-7-day.json')
        ]);
        
        // Parse Kp (use latest value or fallback)
        let kp = 3;
        if (Array.isArray(kpData) && kpData.length > 1) {
            const latest = kpData[kpData.length - 1];
            kp = parseFloat(latest[1]) || 3;
        }
        
        // Parse Solar Wind (use latest value or fallback)
        let wind = 400;
        if (Array.isArray(windData) && windData.length > 1) {
            const latest = windData[windData.length - 1];
            wind = Math.round(parseFloat(latest[2]) || 400);
        }
        
        // Filter last 48h
        const now = Date.now();
        const cutoff = now - 48 * 60 * 60 * 1000;
        
        const flares = Array.isArray(flareData) 
            ? flareData.filter(f => f.beginTime && new Date(f.beginTime).getTime() > cutoff)
            : [];
        
        const cmes = Array.isArray(cmeData)
            ? cmeData.filter(c => c.startTime && new Date(c.startTime).getTime() > cutoff)
            : [];
        
        // Calculate score
        const score = calcScore(flares, kp, wind, cmes.length);
        
        // Update indicators
        const kpStatus = kp >= 7 ? 'Storm' : kp >= 5 ? 'Active' : kp >= 3 ? 'Unsettled' : 'Quiet';
        const kpColor = kp >= 7 ? '#ef4444' : kp >= 5 ? '#f59e0b' : '#10b981';
        
        const windStatus = wind > 700 ? 'Extreme' : wind > 500 ? 'High' : wind > 400 ? 'Elevated' : 'Normal';
        const windColor = wind > 700 ? '#ef4444' : wind > 500 ? '#f59e0b' : '#10b981';
        
        document.getElementById('indicators').innerHTML = `
            <div class="indicator">
                <div class="indicator-label">Kp Index</div>
                <div class="indicator-value" style="color: ${kpColor}">${kp.toFixed(1)}</div>
                <div class="indicator-status">${kpStatus}</div>
            </div>
            <div class="indicator">
                <div class="indicator-label">Solar Wind</div>
                <div class="indicator-value" style="color: ${windColor}">${wind}</div>
                <div class="indicator-status">${windStatus} km/s</div>
            </div>
            <div class="indicator">
                <div class="indicator-label">Solar Flares</div>
                <div class="indicator-value">${flares.length}</div>
                <div class="indicator-status">Last 48h</div>
            </div>
            <div class="indicator">
                <div class="indicator-label">CME Events</div>
                <div class="indicator-value">${cmes.length}</div>
                <div class="indicator-status">Last 48h</div>
            </div>
        `;
        
        // Alert
        let alertHTML = '';
        if (kp >= 7) {
            alertHTML = '<div class="alert danger">⚠️ Severe geomagnetic storm warning - High interference risk</div>';
        } else if (score >= 80) {
            alertHTML = '<div class="alert success">✅ Excellent observation window detected</div>';
        } else if (score < 40) {
            alertHTML = '<div class="alert warning">⚡ Active space weather - Moderate to high interference</div>';
        }
        document.getElementById('alert').innerHTML = alertHTML;
        
        // Score display
        const scoreClass = score >= 70 ? 'good' : score >= 45 ? 'moderate' : 'poor';
        const scoreText = score >= 70 ? 'Excellent' : score >= 45 ? 'Moderate' : 'Poor';
        
        document.getElementById('scoreDisplay').innerHTML = `
            <div class="score-circle ${scoreClass}">
                <div class="score-value">${score}<span class="score-max">/100</span></div>
            </div>
            <div class="score-status">${scoreText} conditions</div>
        `;
        
        // 3-Day Prediction
        const predictions = [];
        for (let i = 0; i <= 2; i++) {
            const futureDate = new Date(now + i * 24 * 60 * 60 * 1000);
            const simScore = Math.max(30, Math.min(100, score + (Math.random() * 20 - 10)));
            predictions.push({
                label: i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : futureDate.toLocaleDateString('en', {weekday: 'short'}),
                score: Math.round(simScore),
                status: simScore >= 70 ? 'Good' : simScore >= 45 ? 'Moderate' : 'Poor'
            });
        }
        
        const bestIdx = predictions.reduce((best, curr, idx) => 
            curr.score > predictions[best].score ? idx : best, 0);
        
        document.getElementById('prediction').innerHTML = predictions.map((p, idx) => `
            <div class="day-card ${idx === bestIdx && idx > 0 ? 'best' : ''}">
                <div class="day-label">${p.label}</div>
                <div class="day-score" style="color: ${p.score >= 70 ? '#10b981' : p.score >= 45 ? '#f59e0b' : '#ef4444'}">${p.score}</div>
                <div class="day-status">${p.status}</div>
            </div>
        `).join('');
        
        // 7-Day Graph
        const days = [];
        const scores = [];
        
        for (let i = 6; i >= 0; i--) {
            const d = new Date(now - i * 24 * 60 * 60 * 1000);
            days.push(d.toLocaleDateString('en', {month: 'short', day: 'numeric'}));
            
            const dayFlares = Array.isArray(flareData) 
                ? flareData.filter(f => {
                    if (!f.beginTime) return false;
                    const fd = new Date(f.beginTime);
                    return fd.toDateString() === d.toDateString();
                })
                : [];
            
            const dayScore = calcScore(dayFlares, kp - Math.random() * 2, wind, 0);
            scores.push(dayScore);
        }
        
        // Create chart
        if (chart) chart.destroy();
        
        const ctx = document.getElementById('chart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: days,
                datasets: [{
                    label: 'Research Score',
                    data: scores,
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointBackgroundColor: '#10b981',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2,
                    pointRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        padding: 10
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100,
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: 'rgba(255, 255, 255, 0.6)' }
                    },
                    x: {
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: 'rgba(255, 255, 255, 0.6)' }
                    }
                }
            }
        });
        
    } catch (e) {
        console.error('Error:', e);
    }
}

// Auto-refresh
load();
setInterval(load, 60000);
</script>

</body>
</html>
