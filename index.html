<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroGuard - Advanced Space Weather Console</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    width: 100%;
    height: 100%;
    overflow-x: hidden;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #000;
    color: #fff;
}

/* Deep Space Background */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
        radial-gradient(ellipse at 20% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
        radial-gradient(circle at center, rgba(0, 0, 0, 0.3) 0%, transparent 100%),
        linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #16213e 100%);
    z-index: -2;
}

/* Stars */
body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
        radial-gradient(2px 2px at 20% 30%, white, transparent),
        radial-gradient(2px 2px at 60% 70%, white, transparent),
        radial-gradient(1px 1px at 50% 50%, white, transparent),
        radial-gradient(1px 1px at 80% 10%, white, transparent),
        radial-gradient(2px 2px at 90% 60%, white, transparent),
        radial-gradient(1px 1px at 10% 90%, white, transparent),
        radial-gradient(2px 2px at 30% 20%, white, transparent),
        radial-gradient(1px 1px at 70% 40%, white, transparent);
    background-size: 200% 200%;
    background-repeat: repeat;
    animation: twinkle 100s linear infinite;
    opacity: 0.6;
    z-index: -1;
}

@keyframes twinkle {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 0.8; }
}

/* Galaxy Center */
.galaxy-center {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 800px;
    height: 800px;
    background: radial-gradient(circle at center, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
    border-radius: 50%;
    z-index: -1;
    filter: blur(80px);
}

/* Container */
.container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 30px 20px;
    position: relative;
    z-index: 10;
}

/* Glass Effect */
.glass {
    background: rgba(15, 23, 42, 0.7);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    transition: all 0.3s ease;
}

.glass:hover {
    border-color: rgba(255, 255, 255, 0.2);
    background: rgba(15, 23, 42, 0.8);
}

/* Header */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 32px;
    margin-bottom: 24px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-icon {
    font-size: 32px;
    animation: float 4s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

.logo-text h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.logo-text p {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 1px;
    margin-top: 2px;
}

.time-status {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.7);
}

.status-dot {
    width: 8px;
    height: 8px;
    background: #10b981;
    border-radius: 50%;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 6px #10b981; }
    50% { opacity: 0.4; }
}

/* Alert */
.alert-container {
    margin-bottom: 24px;
}

.alert {
    padding: 16px 24px;
    border-radius: 12px;
    border-left: 4px solid;
    display: flex;
    align-items: center;
    gap: 12px;
    animation: slideIn 0.5s ease;
}

@keyframes slideIn {
    from { transform: translateY(-20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.alert.success {
    background: rgba(16, 185, 129, 0.15);
    border-color: #10b981;
}

.alert.warning {
    background: rgba(245, 158, 11, 0.15);
    border-color: #f59e0b;
}

.alert.danger {
    background: rgba(239, 68, 68, 0.15);
    border-color: #ef4444;
}

.alert-icon { font-size: 20px; }
.alert-text { flex: 1; font-size: 14px; font-weight: 500; }

/* Indicators Grid */
.indicators-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
}

.indicator-card {
    padding: 24px;
    text-align: center;
}

.indicator-label {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
}

.indicator-value {
    font-size: 42px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 6px;
}

.indicator-status {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.7);
}

/* Main Grid */
.main-grid {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 24px;
    margin-bottom: 24px;
}

.score-card {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 32px;
}

.score-circle {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 5px solid;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-bottom: 24px;
    background: rgba(0, 0, 0, 0.3);
}

.score-circle.good {
    border-color: #10b981;
    box-shadow: 0 0 40px rgba(16, 185, 129, 0.4);
}

.score-circle.moderate {
    border-color: #f59e0b;
    box-shadow: 0 0 40px rgba(245, 158, 11, 0.4);
}

.score-circle.poor {
    border-color: #ef4444;
    box-shadow: 0 0 40px rgba(239, 68, 68, 0.4);
}

.score-number {
    font-size: 64px;
    font-weight: 700;
    line-height: 1;
}

.score-max {
    font-size: 24px;
    opacity: 0.4;
}

.score-label {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.8);
    margin-top: 12px;
}

/* Chart */
.chart-card {
    padding: 32px;
}

.chart-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 20px;
}

.chart-container {
    position: relative;
    height: 300px;
}

/* Prediction Grid */
.prediction-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-top: 24px;
}

.day-forecast {
    padding: 24px;
    text-align: center;
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    transition: all 0.3s ease;
}

.day-forecast:hover {
    border-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-4px);
}

.day-forecast.best {
    border-color: #10b981;
    background: rgba(16, 185, 129, 0.1);
}

.day-label {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
}

.day-score {
    font-size: 44px;
    font-weight: 700;
    margin-bottom: 8px;
}

.day-status {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.7);
}

.best-badge {
    display: inline-block;
    background: rgba(16, 185, 129, 0.2);
    color: #10b981;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    margin-top: 10px;
}

/* Loading Skeleton */
.skeleton {
    background: linear-gradient(90deg, rgba(255,255,255,0.1) 25%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.1) 75%);
    background-size: 200% 100%;
    animation: loading 1.5s infinite;
    border-radius: 8px;
    height: 20px;
}

@keyframes loading {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

@media (max-width: 768px) {
    .main-grid { grid-template-columns: 1fr; }
    .header { flex-direction: column; gap: 12px; text-align: center; }
}
</style>
</head>
<body>

<div class="galaxy-center"></div>

<div class="container">
    
    <!-- Header -->
    <div class="glass header">
        <div class="logo">
            <div class="logo-icon">🛰️</div>
            <div class="logo-text">
                <h1>AstroGuard</h1>
                <p>SPACE WEATHER INTELLIGENCE</p>
            </div>
        </div>
        <div class="time-status">
            <div class="status-dot"></div>
            <span id="updateTime">Initializing...</span>
        </div>
    </div>

    <!-- Alert -->
    <div class="alert-container" id="alertContainer"></div>

    <!-- Indicators -->
    <div class="indicators-grid" id="indicatorsGrid">
        <div class="glass indicator-card"><div class="skeleton" style="height: 40px;"></div></div>
        <div class="glass indicator-card"><div class="skeleton" style="height: 40px;"></div></div>
        <div class="glass indicator-card"><div class="skeleton" style="height: 40px;"></div></div>
        <div class="glass indicator-card"><div class="skeleton" style="height: 40px;"></div></div>
    </div>

    <!-- Main Content -->
    <div class="main-grid">
        <!-- Score -->
        <div class="glass score-card">
            <div class="section-title" style="margin-bottom: 20px;">Research Score</div>
            <div id="scoreDisplay" style="width: 100%;">
                <div class="skeleton" style="height: 200px; border-radius: 50%; width: 200px; margin: 0 auto 20px;"></div>
            </div>
        </div>

        <!-- Chart -->
        <div class="glass chart-card">
            <div class="chart-title">📈 7-Day Trend Analysis</div>
            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Prediction -->
    <div class="glass" style="padding: 32px;">
        <div class="chart-title">🗓️ 3-Day Forecast</div>
        <div class="prediction-grid" id="predictionGrid">
            <div class="day-forecast"><div class="skeleton" style="height: 100px;"></div></div>
            <div class="day-forecast"><div class="skeleton" style="height: 100px;"></div></div>
            <div class="day-forecast"><div class="skeleton" style="height: 100px;"></div></div>
        </div>
    </div>

</div>

<script>
let chartInstance = null;

// Safe fetch with proper error handling
async function fetchData(url) {
    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Failed to fetch');
        return await response.json();
    } catch (error) {
        console.warn(`Fetch failed for ${url}:`, error);
        return null;
    }
}

// Parallel fetch all data
async function loadAllData() {
    return Promise.all([
        fetchData('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json'),
        fetchData('https://services.swpc.noaa.gov/products/solar-wind/plasma-7-day.json'),
        fetchData('https://api.nasa.gov/DONKI/FLR?api_key=DEMO_KEY')
    ]);
}

// Parse Kp Index
function getKpValue(data) {
    if (!Array.isArray(data) || data.length < 2) return 3;
    try {
        const latest = data[data.length - 1];
        return Math.max(0, Math.min(9, parseFloat(latest[1]) || 3));
    } catch {
        return 3;
    }
}

// Parse Solar Wind
function getWindValue(data) {
    if (!Array.isArray(data) || data.length < 2) return 400;
    try {
        const latest = data[data.length - 1];
        return Math.max(200, Math.min(1000, parseFloat(latest[2]) || 400));
    } catch {
        return 400;
    }
}

// Parse Flares (last 48h)
function getRecentFlares(data) {
    if (!Array.isArray(data)) return [];
    const cutoff = Date.now() - 48 * 60 * 60 * 1000;
    return data.filter(flare => {
        try {
            return flare.beginTime && new Date(flare.beginTime).getTime() > cutoff;
        } catch {
            return false;
        }
    });
}

// Calculate scientific score
function calculateScore(kp, wind, recentFlares) {
    let score = 100;
    
    // Kp impact
    if (kp >= 7) score -= 35;
    else if (kp >= 5) score -= 22;
    else if (kp >= 3) score -= 10;
    
    // Solar wind impact
    if (wind > 700) score -= 25;
    else if (wind > 500) score -= 15;
    else if (wind > 400) score -= 8;
    
    // Flares impact
    recentFlares.forEach(flare => {
        const type = flare.classType?.[0] || 'B';
        if (type === 'X') score -= 32;
        else if (type === 'M') score -= 20;
        else if (type === 'C') score -= 8;
        else score -= 2;
    });
    
    return Math.max(0, Math.min(100, Math.round(score)));
}

// Main load function
async function updateDashboard() {
    try {
        // Update time
        const now = new Date();
        document.getElementById('updateTime').textContent = 
            `Updated: ${now.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}`;
        
        // Load all data in parallel
        const [kpData, windData, flareData] = await loadAllData();
        
        // Parse values
        const kp = getKpValue(kpData);
        const wind = getWindValue(windData);
        const recentFlares = getRecentFlares(flareData || []);
        
        // Calculate score
        const score = calculateScore(kp, wind, recentFlares);
        
        // Determine status
        const scoreClass = score >= 70 ? 'good' : score >= 45 ? 'moderate' : 'poor';
        const scoreText = score >= 70 ? 'Excellent' : score >= 45 ? 'Moderate' : 'Poor';
        
        // Alert message
        let alertHTML = '';
        if (kp >= 7) {
            alertHTML = `
                <div class="alert danger">
                    <div class="alert-icon">⚠️</div>
                    <div class="alert-text">Severe Geomagnetic Storm - Kp${Math.round(kp)}</div>
                </div>
            `;
        } else if (score >= 80) {
            alertHTML = `
                <div class="alert success">
                    <div class="alert-icon">✅</div>
                    <div class="alert-text">Optimal Conditions for Observations</div>
                </div>
            `;
        } else if (score < 40) {
            alertHTML = `
                <div class="alert warning">
                    <div class="alert-icon">⚡</div>
                    <div class="alert-text">High Interference Risk - Monitor Closely</div>
                </div>
            `;
        }
        document.getElementById('alertContainer').innerHTML = alertHTML;
        
        // Indicators
        const kpStatus = kp >= 7 ? 'Storm' : kp >= 5 ? 'Active' : kp >= 3 ? 'Unsettled' : 'Quiet';
        const kpColor = kp >= 7 ? '#ef4444' : kp >= 5 ? '#f59e0b' : '#10b981';
        
        const windStatus = wind > 700 ? 'Extreme' : wind > 500 ? 'High' : wind > 400 ? 'Elevated' : 'Normal';
        const windColor = wind > 700 ? '#ef4444' : wind > 500 ? '#f59e0b' : '#10b981';
        
        document.getElementById('indicatorsGrid').innerHTML = `
            <div class="glass indicator-card">
                <div class="indicator-label">Kp Index</div>
                <div class="indicator-value" style="color: ${kpColor}">${kp.toFixed(1)}</div>
                <div class="indicator-status">${kpStatus}</div>
            </div>
            <div class="glass indicator-card">
                <div class="indicator-label">Solar Wind</div>
                <div class="indicator-value" style="color: ${windColor}">${Math.round(wind)}</div>
                <div class="indicator-status">${windStatus} km/s</div>
            </div>
            <div class="glass indicator-card">
                <div class="indicator-label">Solar Flares</div>
                <div class="indicator-value">${recentFlares.length}</div>
                <div class="indicator-status">Last 48 hours</div>
            </div>
            <div class="glass indicator-card">
                <div class="indicator-label">Aurora Activity</div>
                <div class="indicator-value">${kp >= 7 ? '🌌' : kp >= 5 ? '✨' : '○'}</div>
                <div class="indicator-status">${kpStatus}</div>
            </div>
        `;
        
        // Score display
        document.getElementById('scoreDisplay').innerHTML = `
            <div class="score-circle ${scoreClass}">
                <div class="score-number">${score}<span class="score-max">/100</span></div>
            </div>
            <div class="score-label">${scoreText} Conditions</div>
        `;
        
        // 3-Day Forecast
        const predictions = [];
        for (let i = 0; i <= 2; i++) {
            const futureDate = new Date(Date.now() + i * 24 * 60 * 60 * 1000);
            const variance = (Math.sin(i) * 15) + (Math.random() * 10 - 5);
            const predScore = Math.max(20, Math.min(100, Math.round(score + variance)));
            
            predictions.push({
                label: i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : futureDate.toLocaleDateString('en', {weekday: 'short'}),
                score: predScore,
                status: predScore >= 70 ? 'Good' : predScore >= 45 ? 'Moderate' : 'Poor'
            });
        }
        
        const bestIdx = predictions.reduce((best, curr, idx) => 
            curr.score > predictions[best].score ? idx : best, 0);
        
        document.getElementById('predictionGrid').innerHTML = predictions.map((p, idx) => `
            <div class="glass day-forecast ${idx === bestIdx ? 'best' : ''}">
                <div class="day-label">${p.label}</div>
                <div class="day-score" style="color: ${p.score >= 70 ? '#10b981' : p.score >= 45 ? '#f59e0b' : '#ef4444'}">
                    ${p.score}
                </div>
                <div class="day-status">${p.status}</div>
                ${idx === bestIdx ? '<div class="best-badge">⭐ Optimal Window</div>' : ''}
            </div>
        `).join('');
        
        // 7-Day Chart
        const days = [];
        const scores = [];
        
        for (let i = 6; i >= 0; i--) {
            const date = new Date(Date.now() - i * 24 * 60 * 60 * 1000);
            days.push(date.toLocaleDateString('en', {month: 'short', day: 'numeric'}));
            
            // Simulate daily variation
            const baseScore = score - (i * 2);
            const dailyScore = Math.max(20, Math.min(100, Math.round(baseScore + (Math.random() * 15 - 7))));
            scores.push(dailyScore);
        }
        
        // Create or update chart
        if (chartInstance) chartInstance.destroy();
        
        const ctx = document.getElementById('trendChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: days,
                datasets: [{
                    label: 'Research Score',
                    data: scores,
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointBackgroundColor: '#10b981',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2,
                    pointRadius: 6,
                    pointHoverRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(0, 0, 0, 0.9)',
                        padding: 12,
                        titleColor: '#fff',
                        bodyColor: '#fff',
                        borderColor: 'rgba(255, 255, 255, 0.2)',
                        borderWidth: 1
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100,
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: 'rgba(255, 255, 255, 0.6)' }
                    },
                    x: {
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: 'rgba(255, 255, 255, 0.6)' }
                    }
                }
            }
        });
        
    } catch (error) {
        console.error('Dashboard update error:', error);
    }
}

// Initial load
updateDashboard();

// Auto-refresh every 60 seconds
setInterval(updateDashboard, 60000);
</script>

</body>
</html>
