<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroGuard Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:-apple-system,system-ui;
    color:#fff;
    overflow-x:hidden;
}

/* 🌌 Background */
body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:url('https://images-assets.nasa.gov/image/PIA01322/PIA01322~orig.jpg') center/cover no-repeat;
    z-index:-2;
}
body::after{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(18px);
    z-index:-1;
}

/* 💎 Glass (Optimized) */
.glass{
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(18px) saturate(150%);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* Header */
.header{
    display:flex;
    justify-content:space-between;
    margin:20px;
    padding:20px;
}

/* Grid */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    padding:20px;
}

.card{padding:20px;text-align:center}
.big{font-size:32px;font-weight:bold}

/* Score */
.score{text-align:center;padding:30px}
.circle{
    width:170px;height:170px;border-radius:50%;
    border:3px solid #fff;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;margin:auto;
}

/* Alert */
.alert{
    margin:20px;
    padding:15px;
    border-radius:12px;
    background:rgba(255,0,0,0.2);
}

/* Map */
.map{
    height:180px;
    margin:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:20px;
}
</style>
</head>

<body>

<div class="header glass">
    <h2>🛰️ AstroGuard</h2>
    <div id="time">--:--</div>
</div>

<div id="alert"></div>

<div class="grid" id="indicators"></div>

<div class="glass score" id="main"></div>

<div class="glass map" id="map"></div>

<script>
const NASA_API_KEY="US0yyc0uLO3wOPg5wLiCatsMHmVqisoOEdcAMxcx";

/* ⚡ SAFE FETCH */
async function safeFetch(url, timeout=3000){
    return new Promise(resolve=>{
        const timer=setTimeout(()=>resolve(null),timeout);
        fetch(url)
        .then(r=>r.json())
        .then(d=>{clearTimeout(timer);resolve(d);})
        .catch(()=>{clearTimeout(timer);resolve(null);});
    });
}

/* G SCALE */
function getGScale(kp){
    if(kp>=9) return "G5 Extreme";
    if(kp>=8) return "G4 Severe";
    if(kp>=7) return "G3 Strong";
    if(kp>=6) return "G2 Moderate";
    if(kp>=5) return "G1 Minor";
    return "Quiet";
}

/* SCORE */
function calcScore(flares,kp,wind,cme){
    let score=100;
    const w={X:40,M:25,C:8,B:1};

    flares.forEach(f=>{
        const t=f?.classType?.[0]||'B';
        score-=w[t]||0;
    });

    if(kp>=7) score-=30;
    else if(kp>=5) score-=20;

    if(wind>700) score-=20;
    else if(wind>500) score-=10;

    score-=Math.min(cme,3)*25;

    return Math.max(0,Math.round(score));
}

/* LOAD */
async function load(){

    document.getElementById("indicators").innerHTML="⚡ Loading...";
    document.getElementById("main").innerHTML="🚀 Syncing space data...";

    try{
        const [flareData,cmeData,kpData,windData]=await Promise.all([
            safeFetch(`https://api.nasa.gov/DONKI/FLR?api_key=${NASA_API_KEY}`),
            safeFetch(`https://api.nasa.gov/DONKI/CME?api_key=${NASA_API_KEY}`),
            safeFetch("https://api.allorigins.win/raw?url=https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"),
            safeFetch("https://api.allorigins.win/raw?url=https://services.swpc.noaa.gov/products/solar-wind/plasma-7-day.json")
        ]);

        const kp = kpData?.length>1 ? parseFloat(kpData.at(-1)[1])||3 : 3;
        const wind = windData?.length>1 ? parseFloat(windData.at(-1)[2])||400 : 400;

        const flares = Array.isArray(flareData)?flareData.slice(-5):[];
        const cmes = Array.isArray(cmeData)?cmeData:[];

        const score = calcScore(flares,kp,wind,cmes.length);

        /* ALERT */
        let alert="";
        if(kp>=7) alert="⚠️ Geomagnetic Storm";
        else if(score>80) alert="✅ Perfect Conditions";
        else if(score<40) alert="⚡ High Interference";

        document.getElementById("alert").innerHTML=
            alert?`<div class="alert glass">${alert}</div>`:"";

        /* INDICATORS */
        document.getElementById("indicators").innerHTML=`
        <div class="glass card">
            <div>Kp</div>
            <div class="big">${kp.toFixed(1)}</div>
            <small>${getGScale(kp)}</small>
        </div>

        <div class="glass card">
            <div>Wind</div>
            <div class="big">${wind}</div>
            <small>km/s</small>
        </div>

        <div class="glass card">
            <div>Flares</div>
            <div class="big">${flares.length}</div>
        </div>

        <div class="glass card">
            <div>CME</div>
            <div class="big">${cmes.length}</div>
        </div>
        `;

        /* SCORE UI */
        document.getElementById("main").innerHTML=`
        <div class="circle" style="
            border-color:${score>70?'#10b981':score>40?'#f59e0b':'#ef4444'};
        ">
            <div style="font-size:48px">${score}</div>
            <small>/100</small>
        </div>

        <h2 style="margin-top:10px">
        ${score>70?"Excellent":score>40?"Moderate":"Poor"}
        </h2>

        <div style="font-size:12px;opacity:0.6;margin-top:10px">
        📡 NASA + NOAA (Real-time)
        </div>
        `;

        /* MAP */
        document.getElementById("map").innerHTML=
            kp>=7?"🌍 Aurora visible mid-latitudes":
            kp>=5?"❄️ Aurora near poles":
            "Not visible";

        /* CACHE */
        localStorage.setItem("astroCache",JSON.stringify({kp,wind,score}));

    }catch(e){

        const cache=JSON.parse(localStorage.getItem("astroCache"));

        document.getElementById("main").innerHTML=
            cache?"⚡ Offline mode (cached data)":"❌ Failed to load data";
    }

    document.getElementById("time").innerText=new Date().toLocaleTimeString();
}

load();
setInterval(load,60000);
</script>

</body>
</html>f
