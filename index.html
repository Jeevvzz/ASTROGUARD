<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroGuard - NASA UI</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
    color:#fff;
    background:#05070d;
    overflow-x:hidden;
}

/* 🌌 REAL GALAXY BACKGROUND */
body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at center, rgba(0,0,0,0.2), #05070d 70%),
    url("https://images-assets.nasa.gov/image/PIA04252/PIA04252~orig.jpg") center/cover no-repeat;
    z-index:-2;
}

/* ✨ Stars */
body::after{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background-image:
    radial-gradient(2px 2px at 20% 30%, white, transparent),
    radial-gradient(2px 2px at 70% 60%, white, transparent),
    radial-gradient(1px 1px at 50% 50%, white, transparent);
    opacity:0.3;
    z-index:-1;
}

/* Container */
.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

/* Header */
.header{
    display:flex;
    justify-content:space-between;
    padding:18px 22px;
    background:rgba(15,20,35,0.6);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    backdrop-filter:blur(10px);
}

.logo{
    font-size:22px;
    font-weight:700;
}

/* Cards */
.card{
    background:rgba(15,20,35,0.55);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
    padding:20px;
    backdrop-filter:blur(10px);
}

/* Grid */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:15px;
    margin-top:20px;
}

/* Indicator */
.indicator{text-align:center}
.indicator h2{font-size:28px;margin:5px 0}
.indicator p{font-size:12px;opacity:.6}

/* Score */
.score{
    text-align:center;
    margin-top:20px;
}

.circle{
    width:160px;height:160px;
    border-radius:50%;
    border:3px solid #10b981;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    margin:auto;
    background:rgba(0,0,0,0.4);
}

.circle.poor{border-color:#ef4444}
.circle.mid{border-color:#f59e0b}

.circle h1{font-size:42px}

/* Chart */
.chart-box{height:260px;margin-top:20px}

/* Alert */
.alert{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    font-size:14px;
}

.alert.red{background:rgba(239,68,68,0.2)}
.alert.green{background:rgba(16,185,129,0.2)}
.alert.yellow{background:rgba(245,158,11,0.2)}

</style>
</head>

<body>

<div class="container">

<div class="header">
    <div class="logo">🛰️ AstroGuard</div>
    <div id="time"></div>
</div>

<div id="alert"></div>

<div class="grid" id="indicators"></div>

<div class="card score" id="scoreBox"></div>

<div class="card chart-box">
    <canvas id="chart"></canvas>
</div>

</div>

<script>
let chart=null;

/* FAST FETCH */
async function safeFetch(url){
    try{
        const res = await fetch(url);
        return await res.json();
    }catch{
        return null;
    }
}

/* SCORE */
function calcScore(kp,wind,flares){
    let score=100;

    if(kp>=7) score-=30;
    else if(kp>=5) score-=20;

    if(wind>700) score-=20;
    else if(wind>500) score-=10;

    score -= flares.length * 5;

    return Math.max(0,score);
}

async function load(){

    document.getElementById("time").innerText=new Date().toLocaleTimeString();

    const [kpData,windData,flareData]=await Promise.all([
        safeFetch("https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"),
        safeFetch("https://services.swpc.noaa.gov/products/solar-wind/plasma-7-day.json"),
        safeFetch("https://api.nasa.gov/DONKI/FLR?api_key=DEMO_KEY")
    ]);

    let kp=3, wind=400, flares=[];

    if(kpData) kp=parseFloat(kpData.at(-1)[1])||3;
    if(windData) wind=parseFloat(windData.at(-1)[2])||400;
    if(Array.isArray(flareData)) flares=flareData.slice(-5);

    const score=calcScore(kp,wind,flares);

    /* ALERT */
    let alert="";
    if(kp>=7) alert='<div class="alert red">⚠️ Storm Warning</div>';
    else if(score>80) alert='<div class="alert green">✅ Perfect Conditions</div>';
    else if(score<40) alert='<div class="alert yellow">⚡ High Interference</div>';

    document.getElementById("alert").innerHTML=alert;

    /* INDICATORS */
    document.getElementById("indicators").innerHTML=`
    <div class="card indicator"><p>Kp Index</p><h2>${kp.toFixed(1)}</h2></div>
    <div class="card indicator"><p>Solar Wind</p><h2>${wind}</h2></div>
    <div class="card indicator"><p>Flares</p><h2>${flares.length}</h2></div>
    <div class="card indicator"><p>Status</p><h2>${score>70?"Good":"Risk"}</h2></div>
    `;

    /* SCORE */
    document.getElementById("scoreBox").innerHTML=`
    <div class="circle ${score<40?"poor":score<70?"mid":""}">
        <h1>${score}</h1>
        <small>/100</small>
    </div>
    <p style="margin-top:10px">${score>70?"Excellent":"Unstable"}</p>
    `;

    /* GRAPH */
    const labels=[], data=[];
    for(let i=6;i>=0;i--){
        labels.push(`Day ${7-i}`);
        data.push(Math.max(30,score + (Math.random()*20-10)));
    }

    if(chart) chart.destroy();

    chart=new Chart(document.getElementById("chart"),{
        type:"line",
        data:{
            labels,
            datasets:[{
                data,
                borderColor:"#10b981",
                tension:.4,
                fill:true,
                backgroundColor:"rgba(16,185,129,0.1)"
            }]
        },
        options:{
            plugins:{legend:{display:false}},
            scales:{
                y:{display:false},
                x:{display:false}
            }
        }
    });

}

load();
setInterval(load,60000);
</script>

</body>
</html>
