<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroGuard Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system;color:#fff;overflow-x:hidden}

/* 🌌 Background Image */
body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:url('https://images-assets.nasa.gov/image/PIA01322/PIA01322~orig.jpg') center/cover no-repeat;
    z-index:-2;
}

/* Blur Overlay */
body::after{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    backdrop-filter:blur(25px);
    background:rgba(0,0,0,0.5);
    z-index:-1;
}

/* Glass UI */
.glass{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:20px;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
}

.header{
    display:flex;
    justify-content:space-between;
    margin:20px;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    padding:20px;
}

.card{padding:20px;text-align:center}
.big{font-size:30px;font-weight:bold}

.score{text-align:center;padding:30px}
.circle{
    width:180px;height:180px;border-radius:50%;
    border:3px solid #fff;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;margin:auto;
}

/* ALERT */
.alert{
    margin:20px;
    padding:15px;
    border-radius:12px;
    background:rgba(255,0,0,0.2);
}

/* MAP */
.map{
    height:200px;
    margin:20px;
    background:linear-gradient(to top, #001, #112);
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:20px;
}
</style>
</head>

<body>

<div class="header glass">
    <h2>🛰️ AstroGuard</h2>
    <div id="time">Loading...</div>
</div>

<div id="alert"></div>
<div class="grid" id="indicators"></div>
<div class="glass score" id="main"></div>
<div class="glass map" id="map"></div>

<script>
const NASA_API_KEY="US0yyc0uLO3wOPg5wLiCatsMHmVqisoOEdcAMxcx";

/* ⚡ SAFE FETCH */
async function safeFetch(url, timeout=4000){
    return new Promise((resolve)=>{
        const timer=setTimeout(()=>resolve(null),timeout);

        fetch(url)
        .then(res=>res.json())
        .then(data=>{
            clearTimeout(timer);
            resolve(data);
        })
        .catch(()=>{
            clearTimeout(timer);
            resolve(null);
        });
    });
}

/* G SCALE */
function getGScale(kp){
    if(kp>=9) return "G5 Extreme";
    if(kp>=8) return "G4 Severe";
    if(kp>=7) return "G3 Strong";
    if(kp>=6) return "G2 Moderate";
    if(kp>=5) return "G1 Minor";
    return "Quiet";
}

/* SCORE */
function calcScore(flares,kp,wind,cme){
    let score=100;
    const w={X:40,M:25,C:8,B:1};

    flares.forEach(f=>{
        const t=f?.classType?.[0] || 'B';
        score -= w[t] || 0;
    });

    if(kp>=7) score-=30;
    else if(kp>=5) score-=20;

    if(wind>700) score-=20;
    else if(wind>500) score-=10;

    score -= Math.min(cme,3)*25;

    return Math.max(0,Math.round(score));
}

/* LOAD */
async function load(){

    document.getElementById("indicators").innerHTML="⚡ Fetching real-time data...";
    document.getElementById("main").innerHTML="🚀 Syncing space weather...";

    try{
        const flareData = await safeFetch(`https://api.nasa.gov/DONKI/FLR?api_key=${NASA_API_KEY}`);
        const cmeData   = await safeFetch(`https://api.nasa.gov/DONKI/CME?api_key=${NASA_API_KEY}`);

        const kpData = await safeFetch("https://api.allorigins.win/raw?url=https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json");

        const windData = await safeFetch("https://api.allorigins.win/raw?url=https://services.swpc.noaa.gov/products/solar-wind/plasma-7-day.json");

        const flares = flareData || [];
        const cmes   = cmeData || [];

        const kp = kpData ? parseFloat(kpData[kpData.length-1][1]) : 3;
        const solarWind = windData ? parseFloat(windData[windData.length-1][2]) : 400;

        const recentFlares = flares.slice(-5);
        const cmeCount = cmes.length;

        const score = calcScore(recentFlares,kp,solarWind,cmeCount);

        /* ALERT */
        let alertMsg="";
        if(kp>=7) alertMsg="⚠️ Geomagnetic Storm!";
        else if(score>80) alertMsg="✅ Perfect conditions";
        else if(score<40) alertMsg="⚡ High interference";

        document.getElementById("alert").innerHTML =
            alertMsg ? `<div class="alert glass">${alertMsg}</div>` : "";

        /* INDICATORS */
        document.getElementById("indicators").innerHTML=`
        <div class="glass card"><div>Kp</div><div class="big">${kp}</div><small>${getGScale(kp)}</small></div>
        <div class="glass card"><div>Wind</div><div class="big">${solarWind}</div><small>km/s</small></div>
        <div class="glass card"><div>Flares</div><div class="big">${recentFlares.length}</div></div>
        <div class="glass card"><div>CME</div><div class="big">${cmeCount}</div></div>
        `;

        /* MAIN */
        document.getElementById("main").innerHTML=`
        <div class="circle">
            <div style="font-size:45px">${score}</div>
            <small>/100</small>
        </div>

        <h3 style="margin-top:15px">
        ${score>70?"Excellent":score>40?"Moderate":"Poor"}
        </h3>

        <div style="font-size:12px;opacity:0.6;margin-top:10px">
        📡 NASA + NOAA (Real-time)
        </div>
        `;

        /* MAP */
        document.getElementById("map").innerHTML=
            kp>=7 ? "🌍 Aurora visible mid-latitudes" :
            kp>=5 ? "❄️ Aurora near poles" :
            "Not visible";

        /* CACHE */
        localStorage.setItem("astroCache",JSON.stringify({kp,solarWind,score}));

    }catch(e){
        const cache=JSON.parse(localStorage.getItem("astroCache"));

        if(cache){
            document.getElementById("main").innerHTML="⚡ Offline mode (cached data)";
        }else{
            document.getElementById("main").innerHTML="❌ Failed to load data";
        }
    }

    document.getElementById("time").innerText=new Date().toLocaleTimeString();
}

/* RUN */
load();
setInterval(load,60000);
</script>

</body>
</html>
