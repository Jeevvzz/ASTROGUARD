<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroGuard - Space Weather Intelligence</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
            background: #000;
            color: #fff;
        }
        
        /* Animated Space Background */
        #space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            z-index: 0;
        }
        
        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        
        /* Floating Planets */
        .planet {
            position: fixed;
            border-radius: 50%;
            animation: float 8s infinite ease-in-out;
            opacity: 0.6;
            z-index: 1;
        }
        
        .planet1 {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c92a2a);
            top: 10%;
            right: 5%;
            animation-delay: 0s;
        }
        
        .planet2 {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #51cf66, #2b8a3e);
            bottom: 15%;
            left: 8%;
            animation-delay: 2s;
        }
        
        .planet3 {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%, #748ffc, #4c6ef5);
            top: 50%;
            right: 10%;
            animation-delay: 4s;
        }
        
        /* Glass Morphism Container */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }
        
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .logo {
            font-size: 64px;
            margin-bottom: 10px;
            animation: float 6s infinite ease-in-out;
        }
        
        h1 {
            font-size: 56px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        
        .subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
        }
        
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #10b981;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 20px;
        }
        
        .live-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        /* Score Display */
        .score-display {
            text-align: center;
            padding: 60px 40px;
        }
        
        .score-label {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        
        .score-circle {
            width: 220px;
            height: 220px;
            margin: 0 auto 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
            animation: rotate-glow 10s infinite linear;
        }
        
        @keyframes rotate-glow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        
        .score-circle.good {
            background: radial-gradient(circle, rgba(16, 185, 129, 0.3) 0%, rgba(16, 185, 129, 0) 70%);
            border: 3px solid #10b981;
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.5), inset 0 0 40px rgba(16, 185, 129, 0.2);
        }
        
        .score-circle.moderate {
            background: radial-gradient(circle, rgba(245, 158, 11, 0.3) 0%, rgba(245, 158, 11, 0) 70%);
            border: 3px solid #f59e0b;
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.5), inset 0 0 40px rgba(245, 158, 11, 0.2);
        }
        
        .score-circle.poor {
            background: radial-gradient(circle, rgba(239, 68, 68, 0.3) 0%, rgba(239, 68, 68, 0) 70%);
            border: 3px solid #ef4444;
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.5), inset 0 0 40px rgba(239, 68, 68, 0.2);
        }
        
        .score-value {
            font-size: 80px;
            font-weight: 700;
            line-height: 1;
        }
        
        .score-max {
            font-size: 28px;
            opacity: 0.5;
        }
        
        .score-status {
            font-size: 20px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 10px;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        
        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .stat-sub {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        /* Events Section */
        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .event {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 4px solid;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }
        
        .event:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(5px);
        }
        
        .event.flare {
            border-left-color: #f59e0b;
        }
        
        .event.quiet {
            border-left-color: #10b981;
        }
        
        .event-title {
            font-size: 16px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 8px;
        }
        
        .event-time {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }
        
        /* Button */
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(102, 126, 234, 0.6);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Space Background -->
    <div id="space-bg">
        <div class="stars" id="stars"></div>
    </div>
    
    <!-- Floating Planets -->
    <div class="planet planet1"></div>
    <div class="planet planet2"></div>
    <div class="planet planet3"></div>
    
    <!-- Main Content -->
    <div class="container">
        <div class="header">
            <div class="logo">🛰️</div>
            <h1>AstroGuard</h1>
            <p class="subtitle">Space Weather Intelligence System</p>
            <div class="live-badge">
                <div class="live-dot"></div>
                REAL-TIME NASA DATA
            </div>
        </div>
        
        <div id="content" class="glass-card loading">
            <div class="spinner"></div>
            <div>Connecting to NASA satellites...</div>
        </div>
    </div>

    <script>
        // Create Starfield
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }
        
        createStars();
        
        // NASA API Configuration
        const NASA_API_KEY = 'US0yyc0uLO3wOPg5wLiCatsMHmVqisoOEdcAMxcx'; // REPLACE WITH YOUR REAL KEY FROM api.nasa.gov
        
        async function fetchSpaceWeather() {
            try {
                const today = new Date();
                const sevenDaysAgo = new Date(today - 7 * 24 * 60 * 60 * 1000);
                
                const formatDate = (date) => date.toISOString().split('T')[0];
                const startDate = formatDate(sevenDaysAgo);
                const endDate = formatDate(today);
                
                const flareResponse = await fetch(
                    `https://api.nasa.gov/DONKI/FLR?startDate=${startDate}&endDate=${endDate}&api_key=${NASA_API_KEY}`
                );
                const flares = await flareResponse.json();
                
                const score = calculateScore(flares);
                displayResults(score, flares);
                
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="loading">
                        <div style="font-size: 48px; margin-bottom: 20px;">⚠️</div>
                        <div style="margin-bottom: 20px;">Could not connect to NASA</div>
                        <div style="font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 30px;">
                            Make sure you replaced DEMO_KEY with your real NASA API key
                        </div>
                        <button class="btn" onclick="fetchSpaceWeather()">Retry Connection</button>
                    </div>
                `;
            }
        }
        
        function calculateScore(flares) {
            let penalty = 0;
            const recentFlares = flares.filter(f => {
                const flareDate = new Date(f.beginTime);
                const twoDaysAgo = new Date(Date.now() - 2 * 24 * 60 * 60 * 1000);
                return flareDate > twoDaysAgo;
            });
            
            recentFlares.forEach(flare => {
                const classType = flare.classType ? flare.classType[0] : 'B';
                if (classType === 'X') penalty += 40;
                else if (classType === 'M') penalty += 25;
                else if (classType === 'C') penalty += 10;
            });
            
            return Math.max(0, Math.min(100, 100 - penalty));
        }
        
        function displayResults(score, flares) {
            const scoreClass = score >= 70 ? 'good' : score >= 45 ? 'moderate' : 'poor';
            const statusText = score >= 70 ? 'Excellent conditions' : 
                              score >= 45 ? 'Moderate activity' : 
                              'High interference risk';
            
            const recentFlares = flares.filter(f => {
                const flareDate = new Date(f.beginTime);
                const twoDaysAgo = new Date(Date.now() - 2 * 24 * 60 * 60 * 1000);
                return flareDate > twoDaysAgo;
            }).slice(0, 5);
            
            let eventsHTML = '';
            if (recentFlares.length === 0) {
                eventsHTML = `
                    <div class="event quiet">
                        <div class="event-title">✨ Space weather is quiet</div>
                        <div class="event-time">No significant solar activity detected in the past 48 hours</div>
                    </div>
                `;
            } else {
                recentFlares.forEach(flare => {
                    const time = new Date(flare.beginTime).toLocaleString();
                    eventsHTML += `
                        <div class="event flare">
                            <div class="event-title">☀️ Solar Flare — Class ${flare.classType || 'Unknown'}</div>
                            <div class="event-time">${time}</div>
                        </div>
                    `;
                });
            }
            
            document.getElementById('content').innerHTML = `
                <div class="score-display">
                    <div class="score-label">Research Window Score</div>
                    <div class="score-circle ${scoreClass}">
                        <div class="score-value">${score}<span class="score-max">/100</span></div>
                    </div>
                    <div class="score-status">${statusText}</div>
                    
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-label">Total Flares</div>
                            <div class="stat-value">${flares.length}</div>
                            <div class="stat-sub">Last 7 days</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Recent Events</div>
                            <div class="stat-value">${recentFlares.length}</div>
                            <div class="stat-sub">Last 48 hours</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Status</div>
                            <div class="stat-value" style="font-size: 24px;">${score >= 70 ? '🟢' : score >= 45 ? '🟡' : '🔴'}</div>
                            <div class="stat-sub">${scoreClass.toUpperCase()}</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="glass-card">
                <div class="section-title">Recent Space Weather Events</div>
                ${eventsHTML}
                <div style="text-align: center; margin-top: 30px;">
                    <button class="btn" onclick="fetchSpaceWeather()">🔄 Refresh Data</button>
                </div>
            </div>
            `;
        }
        
        fetchSpaceWeather();
    </script>
</body>
</html>
